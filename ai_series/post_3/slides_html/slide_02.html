<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Tokens & Context Windows — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-code: #1c2128;
    --border: #30363d;
    --border-strong: #484f58;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #6e7681;
    --accent: #f78166;
    --accent-2: #d2a8ff;
    --green: #7ee787;
    --blue: #79c0ff;
    --yellow: #ffd866;
    --pink: #ff7b72;
    --purple: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #050810;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .controls {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 8px;
  }
  .controls button {
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button:hover { background: #21262d; }

  .slide {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    padding: 70px 80px;
  }

  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(110, 118, 129, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 118, 129, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    min-height: 0;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 {
    font-size: 80px;
    font-weight: 800;
    line-height: 1.05;
    margin: 0 0 24px;
    letter-spacing: -0.02em;
  }
  h2 {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.1;
    margin: 0 0 24px;
    letter-spacing: -0.015em;
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.05em;
  }
  .lede {
    font-size: 26px;
    line-height: 1.45;
    color: var(--text-muted);
    margin: 0 0 30px;
    max-width: 92%;
  }
  .body-text {
    font-size: 24px;
    line-height: 1.55;
    color: var(--text);
    margin: 0 0 20px;
  }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  .kw { color: var(--pink); }
  .fn { color: var(--purple); }
  .str { color: var(--green); }
  .num { color: var(--blue); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--blue); }
  .prop { color: var(--accent); }
  .hi { background: rgba(247, 129, 102, 0.15); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  /* Cover */
  .cover-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .cover-content h1 {
    font-size: 100px;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline {
    font-size: 30px;
    color: var(--text-muted);
    margin-top: 32px;
    font-weight: 400;
  }

  /* Pill flow */
  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.green { border-color: var(--green); color: var(--green); }
  .pill.blue { border-color: var(--blue); color: var(--blue); }
  .pill.purple { border-color: var(--purple); color: var(--purple); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }

  /* Tokens */
  .text-panel {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 36px;
    font-size: 36px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 22px;
    letter-spacing: -0.005em;
  }
  .token-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 30px;
    margin-bottom: 22px;
    align-items: center;
  }
  .token {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    padding: 8px 14px;
    border-radius: 6px;
    color: var(--text);
    background: var(--bg-code);
    border: 1px solid var(--border);
    line-height: 1;
    white-space: pre;
  }
  .token.t1 { background: rgba(247, 129, 102, 0.18); border-color: rgba(247, 129, 102, 0.5); color: var(--accent); }
  .token.t2 { background: rgba(126, 231, 135, 0.16); border-color: rgba(126, 231, 135, 0.5); color: var(--green); }
  .token.t3 { background: rgba(121, 192, 255, 0.18); border-color: rgba(121, 192, 255, 0.5); color: var(--blue); }
  .token.t4 { background: rgba(210, 168, 255, 0.18); border-color: rgba(210, 168, 255, 0.5); color: var(--purple); }
  .token.t5 { background: rgba(255, 216, 102, 0.16); border-color: rgba(255, 216, 102, 0.5); color: var(--yellow); }
  .token.t6 { background: rgba(255, 123, 114, 0.18); border-color: rgba(255, 123, 114, 0.5); color: var(--pink); }

  /* Examples row */
  .example-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin-bottom: 22px;
  }
  .example {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    text-align: center;
  }
  .example .word {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    color: var(--text);
    margin-bottom: 10px;
  }
  .example .arrow {
    color: var(--text-dim);
    font-size: 20px;
    margin: 0 6px;
  }
  .example .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--accent);
  }

  /* Context box visualization */
  .context-box {
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 16px;
    background: rgba(247, 129, 102, 0.04);
    margin-bottom: 18px;
  }
  .ctx-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 0.04em;
  }
  .ctx-section {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
  }
  .ctx-section .name { color: var(--text); }
  .ctx-section .size { color: var(--text-dim); font-size: 16px; }
  .ctx-section.sys { border-color: rgba(247, 129, 102, 0.5); }
  .ctx-section.sys .name { color: var(--accent); }
  .ctx-section.hist { border-color: rgba(121, 192, 255, 0.4); }
  .ctx-section.hist .name { color: var(--blue); }
  .ctx-section.tools { border-color: rgba(126, 231, 135, 0.4); }
  .ctx-section.tools .name { color: var(--green); }
  .ctx-section.user { border-color: rgba(210, 168, 255, 0.4); }
  .ctx-section.user .name { color: var(--purple); }
  .ctx-section.out { border-color: rgba(255, 216, 102, 0.4); border-style: dashed; }
  .ctx-section.out .name { color: var(--yellow); }

  /* Compare */
  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 22px;
  }
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
  }
  .panel .ptitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  /* Model windows table */
  .windows {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .window-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1.3fr;
    align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 24px;
    gap: 18px;
  }
  .window-row .model {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--text);
    font-weight: 500;
  }
  .window-row .tokens {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--accent);
    text-align: right;
  }
  .window-row .pages {
    font-size: 18px;
    color: var(--text-muted);
    text-align: right;
  }

  /* Recap */
  .recap-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .recap-list li {
    font-size: 26px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text {
    font-size: 24px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  .center-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin: 16px 0 24px;
    flex-wrap: wrap;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0d1117 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s2">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">human.js</div>
    <div class="slide-num">02 / 08</div>
  </div>
  <div class="content">
    <div class="label">// what you see</div>
    <h2>You read <span style="color: var(--accent);">words</span>.</h2>
    <p class="lede">A sentence is a stream of words to you. Easy. Natural.</p>
    <div class="text-panel">
      The model said hello yesterday.
    </div>
    <div class="center-row">
      <span class="pill blue">31 characters</span>
      <span class="arrow">·</span>
      <span class="pill blue">5 words</span>
    </div>
    <p class="body-text muted">That's how your eyes count it.<br>The model counts differently.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
