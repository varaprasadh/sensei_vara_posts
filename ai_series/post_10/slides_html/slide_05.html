<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>RAG — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-code: #1c2128;
    --border: #30363d;
    --border-strong: #484f58;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #6e7681;
    --accent: #f78166;
    --accent-2: #d2a8ff;
    --green: #7ee787;
    --blue: #79c0ff;
    --yellow: #ffd866;
    --pink: #ff7b72;
    --purple: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #050810;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .controls {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 8px;
  }
  .controls button {
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button:hover { background: #21262d; }

  .slide {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    padding: 70px 80px;
  }

  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(110, 118, 129, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 118, 129, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    min-height: 0;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 {
    font-size: 80px;
    font-weight: 800;
    line-height: 1.05;
    margin: 0 0 24px;
    letter-spacing: -0.02em;
  }
  h2 {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.1;
    margin: 0 0 24px;
    letter-spacing: -0.015em;
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.05em;
  }
  .lede {
    font-size: 26px;
    line-height: 1.45;
    color: var(--text-muted);
    margin: 0 0 30px;
    max-width: 92%;
  }
  .body-text {
    font-size: 24px;
    line-height: 1.55;
    color: var(--text);
    margin: 0 0 20px;
  }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--pink); }
  .fn { color: var(--purple); }
  .str { color: var(--green); }
  .num { color: var(--blue); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--blue); }
  .prop { color: var(--accent); }
  .hi { background: rgba(247, 129, 102, 0.15); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  /* Cover */
  .cover-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .cover-content h1 {
    font-size: 110px;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline {
    font-size: 30px;
    color: var(--text-muted);
    margin-top: 32px;
    font-weight: 400;
  }

  /* Pill flow */
  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.green { border-color: var(--green); color: var(--green); }
  .pill.blue { border-color: var(--blue); color: var(--blue); }
  .pill.purple { border-color: var(--purple); color: var(--purple); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }

  .center-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin: 16px 0 24px;
    flex-wrap: wrap;
  }

  /* Compare panels (for slide 7) */
  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 26px;
  }
  .panel .ptitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .panel .ptag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .panel .ptag.a { background: rgba(247, 129, 102, 0.15); color: var(--accent); }
  .panel .ptag.b { background: rgba(121, 192, 255, 0.15); color: var(--blue); }
  .panel ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .panel ul li {
    font-size: 18px;
    color: var(--text);
    line-height: 1.5;
    padding-left: 20px;
    position: relative;
    margin-bottom: 10px;
  }
  .panel ul li::before {
    content: "·";
    position: absolute;
    left: 4px;
    color: var(--text-dim);
    font-weight: 700;
  }
  .panel ul li.good::before { content: "+"; color: var(--green); font-family: 'JetBrains Mono', monospace; }
  .panel ul li.bad::before { content: "−"; color: var(--pink); font-family: 'JetBrains Mono', monospace; }
  .panel .verdict {
    font-size: 16px;
    color: var(--text-muted);
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    font-style: italic;
  }

  /* Loop diagram (numbered steps) */
  .loop {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 8px 0 20px;
  }
  .loop-step {
    display: flex;
    align-items: center;
    gap: 20px;
    width: 100%;
  }
  .loop-num {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 20px;
    flex-shrink: 0;
  }
  .loop-text {
    font-size: 22px;
    color: var(--text);
    line-height: 1.4;
  }
  .loop-text .hi { color: var(--accent); font-family: 'JetBrains Mono', monospace; background: none; border: none; padding: 0; margin: 0; display: inline; }

  /* Recap */
  .recap-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .recap-list li {
    font-size: 24px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 16px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text {
    font-size: 24px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Flow box for slide 3 */
  .flow-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: stretch;
    margin: 10px 0 22px;
  }
  .flow-stack .pill {
    justify-content: center;
    padding: 18px 26px;
    font-size: 22px;
  }
  .flow-stack .arrow-down {
    color: var(--accent);
    font-size: 28px;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    line-height: 1;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0d1117 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s5">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">retrieval.js</div>
    <div class="slide-num">05 / 08</div>
  </div>
  <div class="content">
    <div class="label">// the heart of it</div>
    <h2>Find by <span style="color: var(--accent);">meaning</span>,<br>not keywords.</h2>
    <p class="lede">Every chunk lives as a point in vector space. The closest neighbors win.</p>

    <svg width="100%" viewBox="0 0 900 400" style="margin: 6px 0;">
      <defs>
        <radialGradient id="qhalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f78166" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#f78166" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Axes -->
      <line x1="60" y1="350" x2="860" y2="350" stroke="#30363d" stroke-width="1.2"/>
      <line x1="60" y1="40" x2="60" y2="350" stroke="#30363d" stroke-width="1.2"/>
      <text x="860" y="370" text-anchor="end" fill="#6e7681" font-family="JetBrains Mono, monospace" font-size="13">dim 1 →</text>
      <text x="50" y="40" text-anchor="end" fill="#6e7681" font-family="JetBrains Mono, monospace" font-size="13">↑ dim 2</text>

      <!-- Top-k ring around query -->
      <circle cx="430" cy="200" r="135" fill="none" stroke="#f78166" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.7"/>
      <text x="566" y="80" fill="#f78166" font-family="JetBrains Mono, monospace" font-size="15" font-style="italic">top-k = 3</text>
      <line x1="555" y1="85" x2="500" y2="120" stroke="#f78166" stroke-width="1.2" opacity="0.6"/>

      <!-- Query (center, big) -->
      <circle cx="430" cy="200" r="60" fill="url(#qhalo)"/>
      <circle cx="430" cy="200" r="14" fill="#f78166" stroke="#0d1117" stroke-width="2"/>
      <text x="430" y="178" text-anchor="middle" fill="#f78166" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">query</text>

      <!-- Neighbor docs (in ring) -->
      <circle cx="350" cy="135" r="10" fill="#7ee787" stroke="#0d1117" stroke-width="2"/>
      <text x="328" y="125" text-anchor="end" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="13">refund policy</text>

      <circle cx="520" cy="155" r="10" fill="#7ee787" stroke="#0d1117" stroke-width="2"/>
      <text x="540" y="148" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="13">return window</text>

      <circle cx="490" cy="275" r="10" fill="#7ee787" stroke="#0d1117" stroke-width="2"/>
      <text x="510" y="290" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="13">money-back terms</text>

      <!-- Far docs (out of ring) -->
      <circle cx="170" cy="90" r="8" fill="#484f58"/>
      <text x="160" y="80" text-anchor="end" fill="#6e7681" font-family="JetBrains Mono, monospace" font-size="12">hr policy</text>

      <circle cx="120" cy="280" r="8" fill="#484f58"/>
      <text x="110" y="285" text-anchor="end" fill="#6e7681" font-family="JetBrains Mono, monospace" font-size="12">login bug</text>

      <circle cx="750" cy="120" r="8" fill="#484f58"/>
      <text x="740" y="115" text-anchor="end" fill="#6e7681" font-family="JetBrains Mono, monospace" font-size="12">api keys</text>

      <circle cx="800" cy="290" r="8" fill="#484f58"/>
      <text x="790" y="295" text-anchor="end" fill="#6e7681" font-family="JetBrains Mono, monospace" font-size="12">pricing</text>

      <circle cx="220" cy="195" r="8" fill="#484f58"/>
      <text x="210" y="190" text-anchor="end" fill="#6e7681" font-family="JetBrains Mono, monospace" font-size="12">onboarding</text>

      <circle cx="680" cy="220" r="8" fill="#484f58"/>
      <text x="695" y="225" fill="#6e7681" font-family="JetBrains Mono, monospace" font-size="12">careers</text>
    </svg>

    <p class="body-text muted" style="font-size: 22px; text-align: center;">Cosine similarity picks the closest neighbors. <span style="color: var(--text-dim);">(see post 9 — embeddings)</span></p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
