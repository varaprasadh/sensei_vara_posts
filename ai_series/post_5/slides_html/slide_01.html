<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>4 Ways Your First Agent Breaks — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --bg-elev: #161b22; --bg-code: #1c2128;
    --border: #30363d; --border-strong: #484f58;
    --text: #e6edf3; --text-muted: #8b949e; --text-dim: #6e7681;
    --accent: #f78166; --green: #7ee787; --blue: #79c0ff; --yellow: #ffd866; --pink: #ff7b72; --purple: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050810; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: #161b22; color: #e6edf3; border: 1px solid #30363d; padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide { width: 1080px; height: 1080px; background: var(--bg); position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); display: flex; flex-direction: column; padding: 70px 80px; }
  .slide::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(110, 118, 129, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(110, 118, 129, 0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab { margin-left: 16px; background: var(--bg-elev); border: 1px solid var(--border); border-bottom: none; padding: 6px 16px; border-radius: 6px 6px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text-muted); }
  .slide-num { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-dim); }
  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }
  .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 30px; border-top: 1px solid var(--border); margin-top: 30px; position: relative; z-index: 1; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text-dim); }
  .footer .handle { color: var(--text-muted); } .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 52px; font-weight: 700; line-height: 1.1; margin: 0 0 20px; letter-spacing: -0.015em; }
  .label { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--accent); margin-bottom: 18px; letter-spacing: 0.05em; }
  .lede { font-size: 24px; line-height: 1.45; color: var(--text-muted); margin: 0 0 28px; max-width: 95%; }
  .body-text { font-size: 22px; line-height: 1.55; color: var(--text); margin: 0 0 18px; }
  .body-text.muted { color: var(--text-muted); }

  pre { background: var(--bg-code); border: 1px solid var(--border); border-radius: 10px; padding: 22px 26px; margin: 0 0 18px; font-family: 'JetBrains Mono', monospace; font-size: 18px; line-height: 1.55; overflow: hidden; color: var(--text); }
  pre.sm { font-size: 16px; padding: 16px 18px; line-height: 1.5; margin-bottom: 0; }
  .kw { color: var(--pink); } .fn { color: var(--purple); } .str { color: var(--green); } .num { color: var(--blue); } .com { color: var(--text-dim); font-style: italic; } .var { color: var(--blue); } .prop { color: var(--accent); }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 100px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .break-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  .br-panel { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px; display: flex; flex-direction: column; }
  .br-panel.problem { border-color: rgba(255, 123, 114, 0.5); }
  .br-panel.fix { border-color: rgba(126, 231, 135, 0.5); }
  .br-panel .ptitle { font-family: 'JetBrains Mono', monospace; font-size: 16px; margin-bottom: 12px; letter-spacing: 0.04em; }
  .br-panel.problem .ptitle { color: var(--pink); }
  .br-panel.fix .ptitle { color: var(--green); }
  .br-panel .desc { font-size: 18px; color: var(--text-muted); line-height: 1.5; margin-top: 12px; }

  .break-num { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 16px; color: var(--accent); margin-right: 14px; padding: 4px 12px; border: 1px solid var(--accent); border-radius: 6px; }

  .loop-flow { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 26px; margin-bottom: 22px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; background: var(--bg-code); border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px 18px; font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--text); white-space: nowrap; }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.green { border-color: var(--green); color: var(--green); }
  .pill.blue { border-color: var(--blue); color: var(--blue); }
  .pill.purple { border-color: var(--purple); color: var(--purple); }
  .arrow { color: var(--text-dim); font-size: 22px; font-family: 'JetBrains Mono', monospace; }

  .ingredients { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .ingredient { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; }
  .ingredient .num { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--accent); margin-bottom: 6px; }
  .ingredient .name { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .ingredient .desc { font-size: 16px; color: var(--text-muted); line-height: 1.45; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li { font-size: 24px; line-height: 1.6; color: var(--text); margin-bottom: 16px; padding-left: 36px; position: relative; }
  .recap-list li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta { margin-top: auto; padding: 26px; background: var(--bg-elev); border: 1px solid var(--accent); border-radius: 12px; text-align: center; }
  .cta-text { font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .cta-handle { font-family: 'JetBrains Mono', monospace; font-size: 30px; color: var(--accent); font-weight: 600; }

  @media print { body { background: white; padding: 0; gap: 0; } .controls { display: none; } .slide { box-shadow: none; border-radius: 0; page-break-after: always; } }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0d1117 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s1">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">agent.js</div>
    <div class="slide-num">01 / 08</div>
  </div>
  <div class="content cover-content">
    <div class="label">// 4 failure modes, 4 fixes</div>
    <h1>Your first<br>agent will<br><span class="accent-text">break</span>.</h1>
    <div class="cover-tagline">Here's how — and how to fix each one.</div>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
