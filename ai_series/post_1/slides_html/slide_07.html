<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>How AI Agents Actually Work — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-code: #1c2128;
    --border: #30363d;
    --border-strong: #484f58;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #6e7681;
    --accent: #f78166;
    --accent-2: #d2a8ff;
    --green: #7ee787;
    --blue: #79c0ff;
    --yellow: #ffd866;
    --pink: #ff7b72;
    --purple: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #050810;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .controls {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 8px;
  }
  .controls button {
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button:hover { background: #21262d; }

  .slide {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    padding: 70px 80px;
  }

  /* Subtle grid background */
  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(110, 118, 129, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 118, 129, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Top bar — fake editor */
  .editor-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* Footer with handle */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  /* Typography */
  h1 {
    font-size: 80px;
    font-weight: 800;
    line-height: 1.05;
    margin: 0 0 24px;
    letter-spacing: -0.02em;
  }
  h2 {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.1;
    margin: 0 0 24px;
    letter-spacing: -0.015em;
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.05em;
  }
  .lede {
    font-size: 26px;
    line-height: 1.45;
    color: var(--text-muted);
    margin: 0 0 30px;
    max-width: 90%;
  }
  .body-text {
    font-size: 24px;
    line-height: 1.55;
    color: var(--text);
    margin: 0 0 20px;
  }
  .body-text.muted { color: var(--text-muted); }

  /* Code blocks */
  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 32px;
    margin: 0 0 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  .kw { color: var(--pink); }
  .fn { color: var(--purple); }
  .str { color: var(--green); }
  .num { color: var(--blue); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--blue); }
  .prop { color: var(--accent); }

  /* Flow arrows */
  .flow-box {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .pill {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 18px 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.green { border-color: var(--green); color: var(--green); }
  .pill.blue { border-color: var(--blue); color: var(--blue); }
  .pill.purple { border-color: var(--purple); color: var(--purple); }
  .arrow {
    color: var(--text-dim);
    font-size: 28px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Cover slide specific */
  .cover-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .cover-content h1 {
    font-size: 110px;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline {
    font-size: 30px;
    color: var(--text-muted);
    margin-top: 32px;
    font-weight: 400;
  }

  /* Concept cards */
  .concept-row {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
  }
  .concept-card {
    flex: 1;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .concept-card .title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .concept-card .desc {
    font-size: 20px;
    color: var(--text);
    line-height: 1.4;
  }

  /* Big visual */
  .big-eq {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 30px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
  }

  /* Loop diagram */
  .loop {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin: 20px 0;
  }
  .loop-step {
    display: flex;
    align-items: center;
    gap: 20px;
    width: 100%;
  }
  .loop-num {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    flex-shrink: 0;
  }
  .loop-text {
    font-size: 24px;
    color: var(--text);
  }
  .loop-text .hi { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  /* Final slide */
  .recap-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .recap-list li {
    font-size: 26px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text {
    font-size: 24px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0d1117 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s7">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">picture.js</div>
    <div class="slide-num">07 / 08</div>
  </div>
  <div class="content">
    <div class="label">// the whole picture</div>
    <h2>So what's an agent?</h2>
    <p class="lede">A loop that lets a model use tools to reach a goal.</p>

    <svg width="100%" viewBox="0 0 900 480" style="margin: 10px 0;">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#f78166" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Goal -->
      <rect x="40" y="200" width="170" height="80" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
      <text x="125" y="235" text-anchor="middle" fill="#79c0ff" font-family="JetBrains Mono, monospace" font-size="20" font-weight="500">Goal</text>
      <text x="125" y="260" text-anchor="middle" fill="#8b949e" font-family="Inter, sans-serif" font-size="15">from user</text>

      <!-- Model (center) -->
      <circle cx="450" cy="240" r="110" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="450" y="235" text-anchor="middle" fill="#d2a8ff" font-family="JetBrains Mono, monospace" font-size="26" font-weight="600">model</text>
      <text x="450" y="265" text-anchor="middle" fill="#8b949e" font-family="Inter, sans-serif" font-size="16">decides next step</text>

      <!-- Tools (right) -->
      <rect x="690" y="80" width="180" height="80" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
      <text x="780" y="115" text-anchor="middle" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="20" font-weight="500">get_weather()</text>
      <text x="780" y="140" text-anchor="middle" fill="#8b949e" font-family="Inter, sans-serif" font-size="14">tool</text>

      <rect x="690" y="200" width="180" height="80" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
      <text x="780" y="235" text-anchor="middle" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="20" font-weight="500">send_email()</text>
      <text x="780" y="260" text-anchor="middle" fill="#8b949e" font-family="Inter, sans-serif" font-size="14">tool</text>

      <rect x="690" y="320" width="180" height="80" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
      <text x="780" y="355" text-anchor="middle" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="20" font-weight="500">search_db()</text>
      <text x="780" y="380" text-anchor="middle" fill="#8b949e" font-family="Inter, sans-serif" font-size="14">tool</text>

      <!-- Goal → model -->
      <line x1="215" y1="240" x2="335" y2="240" stroke="#f78166" stroke-width="2" marker-end="url(#arr)"/>

      <!-- Model → tools -->
      <line x1="558" y1="200" x2="685" y2="135" stroke="#f78166" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="565" y1="240" x2="685" y2="240" stroke="#f78166" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="558" y1="280" x2="685" y2="350" stroke="#f78166" stroke-width="2" marker-end="url(#arr)"/>

      <!-- Tools → model (loop back, dashed) -->
      <path d="M 690 120 Q 600 60 470 130" fill="none" stroke="#f78166" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/>

      <!-- Loop label -->
      <text x="450" y="420" text-anchor="middle" fill="#8b949e" font-family="Inter, sans-serif" font-size="18" font-style="italic">↻ repeat until goal is done</text>
    </svg>

    <p class="body-text muted" style="font-size: 22px; text-align: center;">
      Goal → model thinks → tool runs → model thinks again → done.
    </p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
