<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Latency — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-code: #1c2128;
    --border: #30363d;
    --border-strong: #484f58;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #6e7681;
    --accent: #f78166;
    --accent-2: #d2a8ff;
    --green: #7ee787;
    --blue: #79c0ff;
    --yellow: #ffd866;
    --pink: #ff7b72;
    --purple: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #050810;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .controls {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 8px;
  }
  .controls button {
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button:hover { background: #21262d; }

  .slide {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    padding: 70px 80px;
  }

  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(110, 118, 129, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 118, 129, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    min-height: 0;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 {
    font-size: 80px;
    font-weight: 800;
    line-height: 1.05;
    margin: 0 0 24px;
    letter-spacing: -0.02em;
  }
  h2 {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.1;
    margin: 0 0 24px;
    letter-spacing: -0.015em;
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.05em;
  }
  .lede {
    font-size: 26px;
    line-height: 1.45;
    color: var(--text-muted);
    margin: 0 0 30px;
    max-width: 92%;
  }
  .body-text {
    font-size: 24px;
    line-height: 1.55;
    color: var(--text);
    margin: 0 0 20px;
  }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--pink); }
  .fn { color: var(--purple); }
  .str { color: var(--green); }
  .num { color: var(--blue); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--blue); }
  .prop { color: var(--accent); }
  .hi { background: rgba(247, 129, 102, 0.15); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  /* Cover */
  .cover-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .cover-content h1 {
    font-size: 96px;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline {
    font-size: 30px;
    color: var(--text-muted);
    margin-top: 32px;
    font-weight: 400;
  }

  /* Timeline diagram */
  .timeline-wrap {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 30px 24px;
    margin-bottom: 22px;
  }
  .tl-label-row {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .tl-bar-row {
    display: flex;
    gap: 0;
    height: 44px;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .tl-seg {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: #0d1117;
    white-space: nowrap;
  }
  .tl-seg.queue  { background: #484f58; color: var(--text-muted); width: 18%; }
  .tl-seg.prefill { background: var(--blue); width: 32%; }
  .tl-seg.decode { background: var(--accent); width: 50%; }
  .tl-arrow-row {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 10px;
  }
  .tl-pin {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tl-pin-line {
    width: 2px;
    height: 18px;
    background: var(--border-strong);
  }
  .tl-pin-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tl-pin-label.ttft { color: var(--green); }
  .tl-pin-label.total { color: var(--yellow); }
  .tl-spacer { flex: 1; }
  .tl-def-row {
    display: flex;
    gap: 24px;
  }
  .tl-def {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    color: var(--text-muted);
  }
  .tl-def-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .tl-def-dot.ttft { background: var(--green); }
  .tl-def-dot.total { background: var(--yellow); }

  /* Phase bars */
  .phase-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 18px;
  }
  .phase-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .phase-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    width: 110px;
    flex-shrink: 0;
  }
  .phase-name.q  { color: var(--text-muted); }
  .phase-name.p  { color: var(--blue); }
  .phase-name.d  { color: var(--accent); }
  .phase-bar-bg {
    flex: 1;
    height: 32px;
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .phase-bar-fill {
    height: 100%;
    border-radius: 5px;
    display: flex;
    align-items: center;
    padding-left: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: #0d1117;
    white-space: nowrap;
  }
  .phase-bar-fill.q { background: #484f58; color: var(--text); width: 22%; }
  .phase-bar-fill.p { background: var(--blue); width: 38%; }
  .phase-bar-fill.d { background: var(--accent); width: 58%; }
  .phase-desc {
    font-size: 17px;
    color: var(--text-muted);
    width: 280px;
    flex-shrink: 0;
    line-height: 1.4;
  }

  /* Scale diagram */
  .scale-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 22px;
  }
  .scale-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 26px;
  }
  .scale-card .sc-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .scale-card .sc-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .scale-card.prefill-card .sc-icon { background: rgba(121,192,255,0.15); }
  .scale-card.decode-card  .sc-icon { background: rgba(247,129,102,0.15); }
  .scale-card .sc-title {
    font-size: 22px;
    font-weight: 700;
  }
  .scale-card.prefill-card .sc-title { color: var(--blue); }
  .scale-card.decode-card  .sc-title { color: var(--accent); }
  .scale-card .sc-factor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .scale-bar-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .scale-bar-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .scale-bar-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    width: 80px;
    flex-shrink: 0;
  }
  .scale-bar-track {
    flex: 1;
    height: 20px;
    background: var(--bg-code);
    border-radius: 4px;
    overflow: hidden;
  }
  .scale-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s;
  }
  .prefill-card .scale-bar-fill { background: var(--blue); }
  .decode-card  .scale-bar-fill { background: var(--accent); }

  /* Control lists */
  .control-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .ctrl-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }
  .ctrl-card .cc-icon {
    font-size: 26px;
    margin-bottom: 8px;
  }
  .ctrl-card .cc-title {
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .ctrl-card .cc-desc {
    font-size: 17px;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .ctrl-card.yes-card { border-color: var(--green); }
  .ctrl-card.yes-card .cc-title { color: var(--green); }
  .ctrl-card.no-card  { border-color: var(--border); }
  .ctrl-card.no-card  .cc-title { color: var(--text-muted); }

  /* No-control section */
  .nocontrol-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 22px;
  }
  .nc-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .nc-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(110,118,129,0.15);
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .nc-text {
    font-size: 20px;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .nc-text strong { color: var(--text); font-weight: 600; }

  /* Streaming section */
  .stream-compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .stream-panel {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
  }
  .stream-panel .sp-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .stream-panel .sp-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  .stream-panel .sp-tag.stream  { background: rgba(126,231,135,0.15); color: var(--green); }
  .stream-panel .sp-tag.batch   { background: rgba(121,192,255,0.15); color: var(--blue); }
  .stream-panel .sp-body {
    font-size: 19px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .stream-panel .sp-body strong { color: var(--text); }
  .stream-panel .sp-reply {
    font-size: 17px;
    color: var(--text-muted);
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    margin-top: 12px;
    font-style: italic;
  }
  .stream-panel .sp-reply::before {
    content: "→ ";
    color: var(--accent);
    font-style: normal;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Cheatsheet */
  .cheat-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
  }
  .cheat-row {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
  }
  .cheat-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    width: 200px;
    flex-shrink: 0;
    line-height: 1.5;
  }
  .cheat-val {
    font-size: 19px;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .cheat-val strong { color: var(--text); }

  /* Recap */
  .recap-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .recap-list li {
    font-size: 24px;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 16px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .recap-list .src { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 18px; }

  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.green  { border-color: var(--green);  color: var(--green); }
  .pill.blue   { border-color: var(--blue);   color: var(--blue); }
  .pill.accent { border-color: var(--accent); color: var(--accent); }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text {
    font-size: 24px;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0d1117 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s1">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">latency.js</div>
    <div class="slide-num">01 / 08</div>
  </div>
  <div class="content cover-content">
    <div class="label">// follow the clock</div>
    <h1>Latency:<br>where the<br>time <span class="accent-text">actually</span><br>goes.</h1>
    <div class="cover-tagline">Your LLM call is slow.<br>Here's why.</div>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
