<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Single-agent vs Multi-agent — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-code: #1c2128;
    --border: #30363d;
    --border-strong: #484f58;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #6e7681;
    --accent: #f78166;
    --accent-2: #d2a8ff;
    --green: #7ee787;
    --blue: #79c0ff;
    --yellow: #ffd866;
    --pink: #ff7b72;
    --purple: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #050810;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .controls {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 8px;
  }
  .controls button {
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button:hover { background: #21262d; }

  .slide {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    padding: 70px 80px;
  }

  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(110, 118, 129, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 118, 129, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    min-height: 0;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 {
    font-size: 80px;
    font-weight: 800;
    line-height: 1.05;
    margin: 0 0 24px;
    letter-spacing: -0.02em;
  }
  h2 {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.1;
    margin: 0 0 24px;
    letter-spacing: -0.015em;
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.05em;
  }
  .lede {
    font-size: 26px;
    line-height: 1.45;
    color: var(--text-muted);
    margin: 0 0 30px;
    max-width: 92%;
  }
  .body-text {
    font-size: 24px;
    line-height: 1.55;
    color: var(--text);
    margin: 0 0 20px;
  }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  .kw { color: var(--pink); }
  .fn { color: var(--purple); }
  .str { color: var(--green); }
  .num { color: var(--blue); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--blue); }
  .prop { color: var(--accent); }
  .hi { background: rgba(247, 129, 102, 0.15); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  /* Cover */
  .cover-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .cover-content h1 {
    font-size: 100px;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline {
    font-size: 30px;
    color: var(--text-muted);
    margin-top: 32px;
    font-weight: 400;
  }

  /* Pill flow */
  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.green { border-color: var(--green); color: var(--green); }
  .pill.blue { border-color: var(--blue); color: var(--blue); }
  .pill.purple { border-color: var(--purple); color: var(--purple); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }

  /* Compare panels */
  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 22px;
  }
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 26px;
  }
  .panel .ptitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .panel .ptag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  .panel .ptag.a { background: rgba(247, 129, 102, 0.15); color: var(--accent); }
  .panel .ptag.b { background: rgba(121, 192, 255, 0.15); color: var(--blue); }
  .panel .ptag.c { background: rgba(126, 231, 135, 0.15); color: var(--green); }
  .panel h3 {
    font-size: 24px;
    margin: 0 0 10px;
    color: var(--text);
    font-weight: 600;
  }
  .panel p {
    font-size: 18px;
    line-height: 1.5;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .panel ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .panel ul li {
    font-size: 18px;
    line-height: 1.5;
    color: var(--text);
    padding-left: 22px;
    position: relative;
    margin-bottom: 8px;
  }
  .panel ul li::before {
    content: "·";
    position: absolute;
    left: 6px;
    color: var(--accent);
    font-weight: 700;
  }

  /* Failure rows */
  .rows {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 18px;
  }
  .row-item {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 22px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
  }
  .row-item .lhs {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--accent);
    white-space: nowrap;
  }
  .row-item .rhs {
    font-size: 22px;
    color: var(--text);
    line-height: 1.4;
  }
  .row-item .rhs .muted { color: var(--text-muted); }

  /* One-agent diagram */
  .one-agent-box {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 22px;
  }

  /* Recap */
  .recap-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .recap-list li {
    font-size: 25px;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 16px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text {
    font-size: 24px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  .center-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin: 16px 0 24px;
    flex-wrap: wrap;
  }

  .caption {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0d1117 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s2">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">one.js</div>
    <div class="slide-num">02 / 08</div>
  </div>
  <div class="content">
    <div class="label">// the simple build</div>
    <h2>Start with <span style="color: var(--accent);">one</span>.</h2>
    <p class="lede">One agent, one system prompt, all the tools. Works for small jobs.</p>

    <div class="one-agent-box">
      <svg width="100%" viewBox="0 0 900 360" style="display:block;">
        <defs>
          <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

        <!-- center agent -->
        <circle cx="450" cy="180" r="90" fill="rgba(247,129,102,0.10)" stroke="#f78166" stroke-width="2.5"/>
        <text x="450" y="170" text-anchor="middle" fill="#f78166" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600">agent</text>
        <text x="450" y="200" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="16">one prompt</text>

        <!-- tools around -->
        <g font-family="JetBrains Mono, monospace" font-size="16">
          <rect x="60"  y="40"  width="170" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
          <text x="145" y="76" text-anchor="middle" fill="#79c0ff">search()</text>

          <rect x="60"  y="150" width="170" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
          <text x="145" y="186" text-anchor="middle" fill="#79c0ff">fetchUrl()</text>

          <rect x="60"  y="260" width="170" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
          <text x="145" y="296" text-anchor="middle" fill="#7ee787">readFile()</text>

          <rect x="670" y="40"  width="170" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
          <text x="755" y="76" text-anchor="middle" fill="#7ee787">writeFile()</text>

          <rect x="670" y="150" width="170" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
          <text x="755" y="186" text-anchor="middle" fill="#d2a8ff">sendEmail()</text>

          <rect x="670" y="260" width="170" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
          <text x="755" y="296" text-anchor="middle" fill="#ffd866">runSql()</text>
        </g>

        <!-- connect tools to agent -->
        <line x1="230" y1="69"  x2="365" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr2)"/>
        <line x1="230" y1="179" x2="358" y2="180" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr2)"/>
        <line x1="230" y1="289" x2="365" y2="215" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr2)"/>
        <line x1="670" y1="69"  x2="538" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr2)"/>
        <line x1="670" y1="179" x2="544" y2="180" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr2)"/>
        <line x1="670" y1="289" x2="538" y2="215" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr2)"/>
      </svg>
    </div>

    <p class="body-text muted">Easy to understand. Easy to debug. Until...</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
