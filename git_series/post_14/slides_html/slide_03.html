<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Force push, safely — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --bg-elev: #13181f;
    --bg-code: #0f1419;
    --border: #252b35;
    --border-strong: #3a4150;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #6e7681;
    --accent: #f1502f;          /* git red-orange */
    --accent-soft: rgba(241, 80, 47, 0.15);
    --branch: #7ee787;          /* branch / success */
    --merge: #79c0ff;           /* merge / info */
    --conflict: #ff7b72;        /* conflict / error */
    --staged: #ffd866;          /* staged / warn */
    --head: #d2a8ff;            /* HEAD / special ref */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 118, 129, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 118, 129, 0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.55;
    color: var(--text);
    margin-bottom: 16px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 8px 0 18px; }
  .compare .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 26px 22px;
  }
  .compare .panel.danger-panel { border-color: rgba(255, 123, 114, 0.5); }
  .compare .panel.safe-panel { border-color: rgba(126, 231, 135, 0.5); }
  .compare .panel-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }
  .compare .panel.danger-panel .panel-title { color: var(--conflict); }
  .compare .panel.safe-panel .panel-title { color: var(--branch); }
  .compare .panel-quote {
    font-size: 19px;
    line-height: 1.45;
    color: var(--text);
    margin: 0 0 14px;
    font-style: italic;
  }
  .compare .panel-effect {
    font-size: 18px;
    line-height: 1.5;
    color: var(--text-muted);
    margin: 0;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .compare .panel.danger-panel .panel-effect strong { color: var(--conflict); }
  .compare .panel.safe-panel .panel-effect strong { color: var(--branch); }

  .ingredients { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  .ingredient {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 20px 22px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .ingredient.danger { border-left-color: var(--conflict); }
  .ingredient.warn { border-left-color: var(--staged); }
  .ingredient.ok { border-left-color: var(--branch); }
  .ingredient .ix {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-size: 20px;
    font-weight: 600;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .ingredient.danger .ix { color: var(--conflict); }
  .ingredient.warn .ix { color: var(--staged); }
  .ingredient.ok .ix { color: var(--branch); }
  .ingredient .ititle {
    font-size: 21px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 6px;
  }
  .ingredient .idesc {
    font-size: 18px;
    color: var(--text-muted);
    line-height: 1.45;
    margin: 0;
  }

  .closing {
    font-size: 22px;
    color: var(--text);
    margin-top: 8px;
    font-style: italic;
  }
  .closing.muted { color: var(--text-muted); }
  .caption {
    font-size: 20px;
    color: var(--conflict);
    text-align: center;
    margin: 6px 0 0;
    font-style: italic;
  }
  .caption.safe { color: var(--branch); }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s3">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">danger.git</div>
    <div class="slide-num">03 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">$ #</span> what <code style="font-family:'JetBrains Mono',monospace; color: var(--conflict);">--force</code> actually does</div>
    <h2><code style="font-family:'JetBrains Mono',monospace; color: var(--text);">--force</code> = <span style="color: var(--accent);">overwrite</span>.</h2>
    <p class="lede">Doesn't check if anyone else pushed since you last pulled. Their commits get nuked.</p>

    <svg width="100%" viewBox="0 0 900 360" style="margin: 4px 0 8px;">
      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#f1502f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="aPush" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#ff7b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- remote label -->
      <text x="40" y="60" fill="#79c0ff" font-family="JetBrains Mono, monospace" font-size="16">remote</text>
      <!-- remote nodes A B C -->
      <circle cx="160" cy="80" r="34" fill="#13181f" stroke="#f1502f" stroke-width="2"/>
      <text x="160" y="85" text-anchor="middle" fill="#ffd866" font-family="JetBrains Mono, monospace" font-size="14">A</text>
      <circle cx="320" cy="80" r="34" fill="#13181f" stroke="#f1502f" stroke-width="2"/>
      <text x="320" y="85" text-anchor="middle" fill="#ffd866" font-family="JetBrains Mono, monospace" font-size="14">B</text>
      <circle cx="480" cy="80" r="36" fill="#13181f" stroke="#ff7b72" stroke-width="2.5"/>
      <text x="480" y="80" text-anchor="middle" fill="#ff7b72" font-family="JetBrains Mono, monospace" font-size="14">C</text>
      <text x="480" y="98" text-anchor="middle" fill="#ff7b72" font-family="Inter, sans-serif" font-size="10">teammate</text>
      <line x1="286" y1="80" x2="194" y2="80" stroke="#f1502f" stroke-width="2" marker-end="url(#a1)"/>
      <line x1="444" y1="80" x2="354" y2="80" stroke="#f1502f" stroke-width="2" marker-end="url(#a1)"/>
      <text x="600" y="85" fill="#8b949e" font-family="Inter, sans-serif" font-size="14" font-style="italic">C added 5 min ago</text>

      <!-- local label -->
      <text x="40" y="210" fill="#d2a8ff" font-family="JetBrains Mono, monospace" font-size="16">your local</text>
      <!-- local nodes A B X -->
      <circle cx="160" cy="230" r="34" fill="#13181f" stroke="#f1502f" stroke-width="2"/>
      <text x="160" y="235" text-anchor="middle" fill="#ffd866" font-family="JetBrains Mono, monospace" font-size="14">A</text>
      <circle cx="320" cy="230" r="34" fill="#13181f" stroke="#f1502f" stroke-width="2"/>
      <text x="320" y="235" text-anchor="middle" fill="#ffd866" font-family="JetBrains Mono, monospace" font-size="14">B</text>
      <circle cx="480" cy="230" r="36" fill="#13181f" stroke="#d2a8ff" stroke-width="2.5"/>
      <text x="480" y="230" text-anchor="middle" fill="#d2a8ff" font-family="JetBrains Mono, monospace" font-size="14">X</text>
      <text x="480" y="248" text-anchor="middle" fill="#d2a8ff" font-family="Inter, sans-serif" font-size="10">rebased</text>
      <line x1="286" y1="230" x2="194" y2="230" stroke="#f1502f" stroke-width="2" marker-end="url(#a1)"/>
      <line x1="444" y1="230" x2="354" y2="230" stroke="#f1502f" stroke-width="2" marker-end="url(#a1)"/>

      <!-- separator between remote/local -->
      <line x1="40" y1="155" x2="540" y2="155" stroke="#252b35" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- push arrow: from local X up-right to the "after" remote -->
      <line x1="540" y1="220" x2="660" y2="155" stroke="#ff7b72" stroke-width="2.5" marker-end="url(#aPush)"/>
      <text x="555" y="200" fill="#ff7b72" font-family="JetBrains Mono, monospace" font-size="13">git push --force</text>

      <!-- after: remote becomes A B X -->
      <text x="710" y="60" fill="#ff7b72" font-family="JetBrains Mono, monospace" font-size="14">after:</text>
      <circle cx="730" cy="110" r="26" fill="#13181f" stroke="#f1502f" stroke-width="2"/>
      <text x="730" y="115" text-anchor="middle" fill="#ffd866" font-family="JetBrains Mono, monospace" font-size="12">A</text>
      <circle cx="800" cy="110" r="26" fill="#13181f" stroke="#f1502f" stroke-width="2"/>
      <text x="800" y="115" text-anchor="middle" fill="#ffd866" font-family="JetBrains Mono, monospace" font-size="12">B</text>
      <circle cx="870" cy="110" r="28" fill="#13181f" stroke="#d2a8ff" stroke-width="2.5"/>
      <text x="870" y="115" text-anchor="middle" fill="#d2a8ff" font-family="JetBrains Mono, monospace" font-size="12">X</text>
      <line x1="774" y1="110" x2="756" y2="110" stroke="#f1502f" stroke-width="1.5" marker-end="url(#a1)"/>
      <line x1="844" y1="110" x2="826" y2="110" stroke="#f1502f" stroke-width="1.5" marker-end="url(#a1)"/>

      <!-- C is gone -->
      <text x="800" y="165" text-anchor="middle" fill="#ff7b72" font-family="JetBrains Mono, monospace" font-size="14" font-style="italic">C is gone.</text>
    </svg>

    <p class="caption">Teammate's work, deleted. Without warning.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
