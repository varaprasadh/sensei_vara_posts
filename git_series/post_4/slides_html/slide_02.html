<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Branches are Pointers — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --bg-elev: #13181f;
    --bg-code: #0f1419;
    --border: #252b35;
    --border-strong: #3a4150;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #6e7681;
    --accent: #f1502f;          /* git red-orange */
    --accent-soft: rgba(241, 80, 47, 0.15);
    --branch: #7ee787;          /* branch / success */
    --merge: #79c0ff;           /* merge / info */
    --conflict: #ff7b72;        /* conflict / error */
    --staged: #ffd866;          /* staged / warn */
    --head: #d2a8ff;            /* HEAD / special ref */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 118, 129, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 118, 129, 0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 26px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 8px 0 22px; }
  .compare .panel {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 28px 26px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .compare .panel .cmd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px;
    color: var(--text);
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .compare .panel .desc { font-size: 19px; color: var(--text-muted); line-height: 1.5; }
  .compare .panel.create { border-color: var(--branch); }
  .compare .panel.create .cmd .op { color: var(--branch); }
  .compare .panel.delete { border-color: var(--conflict); }
  .compare .panel.delete .cmd .op { color: var(--conflict); }
  .compare .panel .title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s2">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">lie.git</div>
    <div class="slide-num">02 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">$ #</span> what most diagrams show</div>
    <h2>Forget the <span style="color: var(--accent);">tree</span> picture.</h2>
    <p class="lede">Every git tutorial shows branches as forking trees with their own copies of code. That's misleading.</p>

    <svg width="100%" viewBox="0 0 900 420" style="margin: 8px 0 16px;">
      <!-- thick main trunk -->
      <rect x="160" y="80" width="64" height="280" rx="10" fill="#1a1f28" stroke="#6e7681" stroke-width="2"/>
      <text x="192" y="385" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="17">main</text>

      <!-- leaves on main (copies of files) -->
      <ellipse cx="100" cy="130" rx="38" ry="20" fill="#13181f" stroke="#7ee787" stroke-width="1.5"/>
      <text x="100" y="135" text-anchor="middle" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="13">app.js</text>

      <ellipse cx="100" cy="220" rx="38" ry="20" fill="#13181f" stroke="#7ee787" stroke-width="1.5"/>
      <text x="100" y="225" text-anchor="middle" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="13">db.js</text>

      <ellipse cx="100" cy="310" rx="38" ry="20" fill="#13181f" stroke="#7ee787" stroke-width="1.5"/>
      <text x="100" y="315" text-anchor="middle" fill="#7ee787" font-family="JetBrains Mono, monospace" font-size="13">ui.js</text>

      <!-- feature branch splitting off (curved trunk) -->
      <path d="M 200 220 Q 380 220 440 160 Q 520 90 660 90" stroke="#1a1f28" stroke-width="46" fill="none" stroke-linecap="round"/>
      <path d="M 200 220 Q 380 220 440 160 Q 520 90 660 90" stroke="#6e7681" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="740" y="58" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="17">feature</text>

      <!-- leaves on feature branch (purple = "copies") -->
      <ellipse cx="540" cy="60" rx="42" ry="20" fill="#13181f" stroke="#d2a8ff" stroke-width="1.5"/>
      <text x="540" y="65" text-anchor="middle" fill="#d2a8ff" font-family="JetBrains Mono, monospace" font-size="13">app.js'</text>

      <ellipse cx="660" cy="140" rx="42" ry="20" fill="#13181f" stroke="#d2a8ff" stroke-width="1.5"/>
      <text x="660" y="145" text-anchor="middle" fill="#d2a8ff" font-family="JetBrains Mono, monospace" font-size="13">api.js'</text>

      <ellipse cx="780" cy="90" rx="38" ry="20" fill="#13181f" stroke="#d2a8ff" stroke-width="1.5"/>
      <text x="780" y="95" text-anchor="middle" fill="#d2a8ff" font-family="JetBrains Mono, monospace" font-size="13">ui.js'</text>

      <!-- big red diagonal slash across -->
      <line x1="80" y1="380" x2="820" y2="40" stroke="#ff7b72" stroke-width="7" opacity="0.9" stroke-linecap="round"/>

      <!-- not really label, bottom-right -->
      <text x="520" y="400" text-anchor="middle" fill="#ff7b72" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" font-style="italic">// not really</text>
    </svg>

    <p class="body-text muted" style="font-size: 22px; text-align: center;">That's <span style="color: var(--conflict);">not</span> what's happening.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
