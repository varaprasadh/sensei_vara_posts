<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>WAL — The DB Writes Twice — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;
    --merge: #ffb454;
    --conflict: #ff7a8a;
    --staged: #c8a8ff;
    --head: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s5">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">pg_wal/recovery</div>
    <div class="slide-num">05 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- #</span> crash recovery</div>
    <h2>Crash. Reboot.<br><span style="color: var(--branch);">Replay</span>. Done.</h2>

    <svg width="100%" viewBox="0 0 920 350" style="margin: 4px 0 10px;">
      <defs>
        <marker id="tarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#4a90c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="tarr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#7ee7b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Timeline axis -->
      <line x1="40" y1="160" x2="880" y2="160" stroke="#243049" stroke-width="2" marker-end="url(#tarr)"/>
      <text x="870" y="188" fill="#6a7a98" font-family="Inter, sans-serif" font-size="14">time →</text>

      <!-- checkpoint dot -->
      <circle cx="120" cy="160" r="10" fill="#4a90c2"/>
      <text x="120" y="145" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="13">checkpoint</text>
      <line x1="120" y1="155" x2="120" y2="130" stroke="#4a90c2" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- write events on timeline -->
      <circle cx="240" cy="160" r="7" fill="#7ee7b8"/>
      <text x="240" y="198" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="12">WAL+buf</text>
      <circle cx="340" cy="160" r="7" fill="#7ee7b8"/>
      <text x="340" y="198" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="12">WAL+buf</text>
      <circle cx="440" cy="160" r="7" fill="#7ee7b8"/>
      <text x="440" y="198" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="12">WAL+buf</text>

      <!-- CRASH -->
      <line x1="560" y1="80" x2="560" y2="240" stroke="#ff7a8a" stroke-width="3" stroke-dasharray="8 4"/>
      <text x="560" y="70" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">CRASH</text>
      <text x="560" y="268" text-anchor="middle" fill="#ff7a8a" font-family="Inter, sans-serif" font-size="13">pages lost from RAM</text>

      <!-- reboot arrow -->
      <line x1="620" y1="160" x2="680" y2="160" stroke="#93a3bf" stroke-width="2" marker-end="url(#tarr)"/>
      <text x="650" y="148" text-anchor="middle" fill="#93a3bf" font-family="Inter, sans-serif" font-size="13">reboot</text>

      <!-- replay block -->
      <rect x="680" y="110" width="180" height="100" rx="10" fill="#141d2e" stroke="#7ee7b8" stroke-width="2"/>
      <text x="770" y="148" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">replay WAL</text>
      <text x="770" y="170" text-anchor="middle" fill="#93a3bf" font-family="Inter, sans-serif" font-size="13">from last</text>
      <text x="770" y="188" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="13">checkpoint</text>

      <!-- WAL arrow to replay block -->
      <line x1="620" y1="115" x2="678" y2="130" stroke="#7ee7b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tarr-g)"/>
      <text x="590" y="108" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="13">WAL on disk</text>
      <text x="590" y="126" fill="#7ee7b8" font-family="Inter, sans-serif" font-size="12" font-style="italic">(survived crash)</text>

      <!-- consistent label -->
      <text x="870" y="145" text-anchor="end" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">consistent ✓</text>
    </svg>

    <p class="body-text muted" style="font-size: 22px; margin: 0;">Lost work? Only what <span style="color: var(--conflict);">wasn't WAL-fsynced</span> before crash. Every fsynced COMMIT is durable.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
