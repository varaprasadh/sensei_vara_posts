<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>WAL — The DB Writes Twice — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;
    --merge: #ffb454;
    --conflict: #ff7a8a;
    --staged: #c8a8ff;
    --head: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s4">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">lsn</div>
    <div class="slide-num">04 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- #</span> why it's fast</div>
    <h2>Sequential I/O<br>beats <span style="color: var(--conflict);">random</span> I/O.</h2>

    <svg width="100%" viewBox="0 0 920 320" style="margin: 8px 0 16px;">
      <defs>
        <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#4a90c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- WAL: sequential strip -->
      <text x="30" y="74" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">WAL (sequential append)</text>
      <rect x="30" y="88" width="780" height="52" rx="6" fill="#141d2e" stroke="#7ee7b8" stroke-width="1.5"/>
      <!-- blocks in WAL -->
      <rect x="36" y="94" width="70" height="40" rx="4" fill="#1a2e20" stroke="#7ee7b8" stroke-width="1"/>
      <text x="71" y="119" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="13">rec 1</text>
      <rect x="112" y="94" width="70" height="40" rx="4" fill="#1a2e20" stroke="#7ee7b8" stroke-width="1"/>
      <text x="147" y="119" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="13">rec 2</text>
      <rect x="188" y="94" width="70" height="40" rx="4" fill="#1a2e20" stroke="#7ee7b8" stroke-width="1"/>
      <text x="223" y="119" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="13">rec 3</text>
      <rect x="264" y="94" width="70" height="40" rx="4" fill="#1a2e20" stroke="#7ee7b8" stroke-width="1"/>
      <text x="299" y="119" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="13">rec 4</text>
      <text x="370" y="119" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="20">→ → → → → →</text>
      <!-- append arrow -->
      <text x="810" y="85" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="13">append</text>
      <text x="824" y="122" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="22">→</text>
      <text x="30" y="162" fill="#7ee7b8" font-family="Inter, sans-serif" font-size="14" font-style="italic">Always at end of file. No seek. One stream.</text>

      <!-- Page writes: random scatter -->
      <text x="30" y="210" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">Heap pages (random I/O)</text>
      <!-- scatter boxes -->
      <rect x="30" y="224" width="52" height="52" rx="6" fill="#2e141d" stroke="#ff7a8a" stroke-width="1.5"/>
      <text x="56" y="254" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="12">pg 7</text>
      <rect x="200" y="224" width="52" height="52" rx="6" fill="#2e141d" stroke="#ff7a8a" stroke-width="1.5"/>
      <text x="226" y="254" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="12">pg 91</text>
      <rect x="400" y="224" width="52" height="52" rx="6" fill="#2e141d" stroke="#ff7a8a" stroke-width="1.5"/>
      <text x="426" y="254" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="12">pg 3</text>
      <rect x="640" y="224" width="52" height="52" rx="6" fill="#2e141d" stroke="#ff7a8a" stroke-width="1.5"/>
      <text x="666" y="254" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="12">pg 44</text>
      <!-- scattered arrows -->
      <path d="M 82 250 Q 140 230 195 250" stroke="#ff7a8a" stroke-width="1.5" fill="none" marker-end="url(#arr2)" stroke-dasharray="4 3"/>
      <path d="M 252 250 Q 325 280 395 250" stroke="#ff7a8a" stroke-width="1.5" fill="none" marker-end="url(#arr2)" stroke-dasharray="4 3"/>
      <path d="M 452 250 Q 540 215 635 250" stroke="#ff7a8a" stroke-width="1.5" fill="none" marker-end="url(#arr2)" stroke-dasharray="4 3"/>
      <text x="30" y="300" fill="#ff7a8a" font-family="Inter, sans-serif" font-size="14" font-style="italic">Scattered across disk. Seek penalty every time.</text>
    </svg>

    <p class="body-text muted" style="font-size: 22px; margin: 0;">WAL appends to <span style="color: var(--branch); font-family:'JetBrains Mono',monospace;">one spot</span>. Pages scatter everywhere. Sequential &gt;&gt; random — especially on spinning disk.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
