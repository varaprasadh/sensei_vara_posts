<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>N+1 — The bug that scales linearly with users — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;          /* postgres blue */
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;          /* mint — success / index */
    --merge: #ffb454;           /* amber — highlight / sql kw */
    --conflict: #ff7a8a;        /* coral — errors */
    --staged: #c8a8ff;          /* lavender — refs */
    --head: #ffb454;            /* amber for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }
  .hi-coral { background: rgba(255, 122, 138, 0.12); border-left: 3px solid var(--conflict); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-content .conflict-text { color: var(--conflict); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 22px; line-height: 1.55;
    color: var(--text);
    margin-bottom: 14px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  .coral-box {
    border: 2px solid var(--conflict);
    border-radius: 10px;
    background: rgba(255, 122, 138, 0.07);
    padding: 6px 10px;
    margin: 2px 0;
  }

  .annotation {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--conflict);
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .fix-header {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 14px;
    padding: 8px 18px;
    border-radius: 8px;
    display: inline-block;
  }
  .fix-header.mint { color: var(--branch); border: 1px solid var(--branch); background: rgba(126, 231, 184, 0.08); }
  .fix-header.amber { color: var(--merge); border: 1px solid var(--merge); background: rgba(255, 180, 84, 0.08); }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s4">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">query_cost.sql</div>
    <div class="slide-num">04 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">$ #</span> what it looks like on the wire</div>
    <h2>101 round trips<br>vs <span style="color: var(--branch);">1</span>.</h2>

    <svg width="100%" viewBox="0 0 920 460" style="margin: 0 0 10px;">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M2 2L8 5L2 8" fill="none" stroke="#6a7a98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- N+1 label -->
      <text x="30" y="48" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">N+1 pattern — 101 queries</text>

      <!-- sequential query bars (compressed) -->
      <!-- each bar = thin rect, slightly different shade -->
      <!-- show 15 bars to represent 101 -->
      <rect x="30" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.9"/>
      <rect x="52" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.85"/>
      <rect x="74" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.80"/>
      <rect x="96" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.75"/>
      <rect x="118" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.70"/>
      <rect x="140" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.65"/>
      <rect x="162" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <rect x="184" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <rect x="206" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <rect x="228" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <rect x="250" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <rect x="272" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <rect x="294" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <rect x="316" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <rect x="338" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.60"/>
      <text x="362" y="82" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">···</text>
      <!-- end bar representing tail -->
      <rect x="390" y="60" width="18" height="34" rx="3" fill="#ff7a8a" opacity="0.9"/>

      <!-- total time label -->
      <line x1="30" y1="108" x2="408" y2="108" stroke="#ff7a8a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
      <text x="210" y="128" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="15">≈ 100ms total (1ms ping × 101)</text>

      <!-- separator -->
      <line x1="30" y1="160" x2="890" y2="160" stroke="#243049" stroke-width="1"/>

      <!-- JOIN label -->
      <text x="30" y="208" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">JOIN — 1 query</text>

      <!-- single JOIN bar — much wider and taller, green -->
      <rect x="30" y="220" width="110" height="54" rx="6" fill="#7ee7b8" opacity="0.85"/>
      <text x="85" y="252" text-anchor="middle" fill="#0b1220" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">JOIN</text>

      <!-- total time label -->
      <line x1="30" y1="288" x2="142" y2="288" stroke="#7ee7b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
      <text x="86" y="308" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="15">≈ 5ms</text>

      <!-- comparison callout -->
      <rect x="480" y="190" width="410" height="160" rx="12" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="685" y="228" text-anchor="middle" fill="#e6edf3" font-family="Inter, sans-serif" font-size="22" font-weight="700">Difference</text>

      <text x="685" y="270" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="32" font-weight="800">101 queries</text>
      <text x="685" y="300" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="20">vs</text>
      <text x="685" y="336" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="32" font-weight="800">1 query</text>

      <!-- x-axis label -->
      <text x="30" y="400" fill="#6a7a98" font-family="Inter, sans-serif" font-size="14" font-style="italic">time →  (same result set, vastly different cost)</text>
    </svg>

    <p class="body-text muted" style="font-size: 20px; margin: 0;">DB latency is per-query. <span style="color: var(--merge);">Fewer queries = faster page.</span> Always.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
