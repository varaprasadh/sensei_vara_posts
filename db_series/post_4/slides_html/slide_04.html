<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Indexes aren't magic — they're sorted pointers — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;          /* postgres blue */
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;          /* mint — success / index */
    --merge: #ffb454;           /* amber — highlight / sql kw */
    --conflict: #ff7a8a;        /* coral — errors */
    --staged: #c8a8ff;          /* lavender — refs */
    --head: #ffb454;            /* amber for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 26px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  .tradeoff-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin: 16px 0;
  }
  .tradeoff-card {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tradeoff-card .tc-icon {
    font-size: 36px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    line-height: 1;
  }
  .tradeoff-card .tc-label {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }
  .tradeoff-card .tc-sub {
    font-size: 17px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s4">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">btree.c</div>
    <div class="slide-num">04 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- </span> how lookup actually works</div>
    <h2>B-tree descent:<br><span style="color: var(--accent);">O(log n)</span> every time.</h2>

    <svg width="100%" viewBox="0 0 920 490" style="margin: 4px 0 10px;">
      <defs>
        <marker id="bt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#243049" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="bth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="bth2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#7ee7b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- ROOT NODE -->
      <rect x="290" y="16" width="340" height="56" rx="8" fill="#141d2e" stroke="#4a90c2" stroke-width="2"/>
      <text x="310" y="36" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">ROOT</text>
      <text x="460" y="53" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="18">dave@  |  mike@  |  zara@</text>

      <!-- INTERNAL NODES -->
      <rect x="60" y="148" width="240" height="50" rx="8" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="180" y="178" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="16">alice@  |  carol@</text>

      <rect x="340" y="148" width="240" height="50" rx="8" fill="#141d2e" stroke="#ffb454" stroke-width="2.5"/>
      <text x="340" y="128" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="12">← search path</text>
      <text x="460" y="178" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="16">dave@  |  eve@</text>

      <rect x="620" y="148" width="240" height="50" rx="8" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="740" y="178" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="16">mike@  |  sara@</text>

      <!-- edges root → internal -->
      <line x1="370" y1="72" x2="200" y2="148" stroke="#243049" stroke-width="1.5" marker-end="url(#bt)"/>
      <line x1="460" y1="72" x2="460" y2="148" stroke="#ffb454" stroke-width="2" marker-end="url(#bth)"/>
      <line x1="550" y1="72" x2="720" y2="148" stroke="#243049" stroke-width="1.5" marker-end="url(#bt)"/>

      <!-- LEAF NODES (bottom row) -->
      <!-- left branch leaf nodes -->
      <rect x="20" y="290" width="168" height="78" rx="7" fill="#0e1626" stroke="#36456a" stroke-width="1.5"/>
      <text x="104" y="315" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="14">alice@x.com</text>
      <text x="104" y="337" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="14">ctid: (0,1)</text>
      <text x="104" y="357" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">→ heap</text>

      <rect x="200" y="290" width="168" height="78" rx="7" fill="#0e1626" stroke="#36456a" stroke-width="1.5"/>
      <text x="284" y="315" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="14">carol@z.com</text>
      <text x="284" y="337" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="14">ctid: (1,2)</text>
      <text x="284" y="357" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">→ heap</text>

      <!-- middle branch leaf nodes (highlighted - search target) -->
      <rect x="380" y="290" width="168" height="78" rx="7" fill="#0e1626" stroke="#ffb454" stroke-width="2.5"/>
      <text x="464" y="315" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">dave@x.com</text>
      <text x="464" y="337" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="14">ctid: (2,7)</text>
      <text x="464" y="357" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">→ heap ✓</text>

      <rect x="560" y="290" width="160" height="78" rx="7" fill="#0e1626" stroke="#36456a" stroke-width="1.5"/>
      <text x="640" y="315" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="14">eve@abc.com</text>
      <text x="640" y="337" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="14">ctid: (3,1)</text>
      <text x="640" y="357" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">→ heap</text>

      <!-- right branch leaf nodes -->
      <rect x="730" y="290" width="168" height="78" rx="7" fill="#0e1626" stroke="#36456a" stroke-width="1.5"/>
      <text x="814" y="315" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="14">mike@y.com</text>
      <text x="814" y="337" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="14">ctid: (5,3)</text>
      <text x="814" y="357" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">→ heap</text>

      <!-- edges internal → leaves -->
      <line x1="150" y1="198" x2="104" y2="290" stroke="#243049" stroke-width="1.5" marker-end="url(#bt)"/>
      <line x1="200" y1="198" x2="268" y2="290" stroke="#243049" stroke-width="1.5" marker-end="url(#bt)"/>

      <line x1="420" y1="198" x2="440" y2="290" stroke="#ffb454" stroke-width="2" marker-end="url(#bth)"/>
      <line x1="490" y1="198" x2="610" y2="290" stroke="#243049" stroke-width="1.5" marker-end="url(#bt)"/>

      <line x1="700" y1="198" x2="780" y2="290" stroke="#243049" stroke-width="1.5" marker-end="url(#bt)"/>

      <!-- Heap box at bottom -->
      <rect x="360" y="420" width="200" height="50" rx="8" fill="#141d2e" stroke="#7ee7b8" stroke-width="2"/>
      <text x="460" y="452" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="16">heap page (2,7)</text>
      <line x1="464" y1="368" x2="460" y2="420" stroke="#7ee7b8" stroke-width="2" marker-end="url(#bth2)"/>

      <!-- lookup label -->
      <text x="46" y="430" fill="#6a7a98" font-family="Inter, sans-serif" font-size="14" font-style="italic">lookup: email = 'dave@x.com'</text>
      <text x="46" y="452" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">root → internal → leaf → heap</text>
    </svg>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
