<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>The Heap — Where Rows Actually Live — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;          /* postgres blue */
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;          /* mint — success / index */
    --merge: #ffb454;           /* amber — highlight / sql kw */
    --conflict: #ff7a8a;        /* coral — errors */
    --staged: #c8a8ff;          /* lavender — refs */
    --head: #ffb454;            /* amber for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }
  .hi-warn { background: rgba(255, 122, 138, 0.12); border-left: 3px solid var(--conflict); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 26px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s4">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">tuple.c</div>
    <div class="slide-num">04 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- #</span> inside one row</div>
    <h2>Every tuple: <span style="color: var(--merge);">header</span><br>+ <span style="color: var(--branch);">data</span>.</h2>

    <svg width="100%" viewBox="0 0 920 380" style="margin: 8px 0 16px;">
      <!-- Tuple box outline -->
      <rect x="20" y="30" width="880" height="320" rx="10" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="460" y="22" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="14">one HeapTupleHeaderData (~23 bytes) + your columns</text>

      <!-- Header section label -->
      <rect x="20" y="30" width="560" height="320" rx="10" fill="rgba(255,180,84,0.06)" stroke="#ffb454" stroke-width="1.5"/>
      <text x="300" y="68" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">HEADER  ~23 bytes</text>

      <!-- Header fields -->
      <rect x="44" y="82" width="120" height="48" rx="5" fill="#0e1626" stroke="#ffb454" stroke-width="1.2"/>
      <text x="104" y="102" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">xmin</text>
      <text x="104" y="120" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">created by tx</text>

      <rect x="178" y="82" width="120" height="48" rx="5" fill="#0e1626" stroke="#ffb454" stroke-width="1.2"/>
      <text x="238" y="102" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">xmax</text>
      <text x="238" y="120" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">deleted by tx</text>

      <rect x="312" y="82" width="120" height="48" rx="5" fill="#0e1626" stroke="#ffb454" stroke-width="1.2"/>
      <text x="372" y="102" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">cmin</text>
      <text x="372" y="120" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">cmd seq</text>

      <rect x="446" y="82" width="120" height="48" rx="5" fill="#0e1626" stroke="#ffb454" stroke-width="1.2"/>
      <text x="506" y="102" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">cmax</text>
      <text x="506" y="120" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">cmd seq</text>

      <rect x="44" y="148" width="150" height="48" rx="5" fill="#0e1626" stroke="#c8a8ff" stroke-width="1.2"/>
      <text x="119" y="168" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="13">ctid</text>
      <text x="119" y="186" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">(page, offset)</text>

      <rect x="208" y="148" width="180" height="48" rx="5" fill="#0e1626" stroke="#ffb454" stroke-width="1.2"/>
      <text x="298" y="168" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">t_infomask</text>
      <text x="298" y="186" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">visibility flags</text>

      <rect x="402" y="148" width="160" height="48" rx="5" fill="#0e1626" stroke="#ffb454" stroke-width="1.2"/>
      <text x="482" y="168" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">null bitmap</text>
      <text x="482" y="186" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">which cols null</text>

      <!-- Overhead label -->
      <text x="300" y="268" text-anchor="middle" fill="#ffb454" font-family="Inter, sans-serif" font-size="20" font-weight="600">23 bytes per row — always</text>
      <text x="300" y="300" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="15">1M rows = 23MB in headers alone</text>

      <!-- Data section -->
      <rect x="580" y="30" width="320" height="320" rx="10" fill="rgba(126,231,184,0.06)" stroke="#7ee7b8" stroke-width="1.5"/>
      <text x="740" y="68" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">USER DATA</text>

      <rect x="604" y="82" width="272" height="48" rx="5" fill="#0e1626" stroke="#7ee7b8" stroke-width="1.2"/>
      <text x="740" y="102" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="14">id  bigint</text>
      <text x="740" y="120" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">8 bytes</text>

      <rect x="604" y="148" width="272" height="48" rx="5" fill="#0e1626" stroke="#7ee7b8" stroke-width="1.2"/>
      <text x="740" y="168" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="14">name  text</text>
      <text x="740" y="186" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">4 + len bytes</text>

      <rect x="604" y="214" width="272" height="48" rx="5" fill="#0e1626" stroke="#7ee7b8" stroke-width="1.2"/>
      <text x="740" y="234" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="14">created_at  timestamptz</text>
      <text x="740" y="252" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="11">8 bytes</text>
    </svg>

    <p class="body-text muted" style="font-size: 21px; margin: 0;"><span style="color: var(--merge); font-family: 'JetBrains Mono', monospace;">xmin</span>/<span style="color: var(--merge); font-family: 'JetBrains Mono', monospace;">xmax</span> enable MVCC — multiple row versions visible to different transactions.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
