<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>B-tree vs Hash vs GIN vs BRIN — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;          /* postgres blue */
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;          /* mint — success / index */
    --merge: #ffb454;           /* amber — highlight / sql kw */
    --conflict: #ff7a8a;        /* coral — errors */
    --staged: #c8a8ff;          /* lavender — refs */
    --head: #ffb454;            /* amber for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Decision matrix table */
  .matrix {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
    font-family: 'JetBrains Mono', monospace;
  }
  .matrix th {
    background: var(--bg-elev);
    color: var(--text-dim);
    font-weight: 600;
    padding: 12px 16px;
    text-align: left;
    border: 1px solid var(--border);
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .matrix td {
    padding: 14px 16px;
    border: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
    line-height: 1.4;
    font-size: 16px;
  }
  .matrix tr:nth-child(even) td { background: rgba(74,144,194,0.04); }
  .matrix .type-btree { color: var(--accent); font-weight: 600; }
  .matrix .type-hash { color: var(--branch); font-weight: 600; }
  .matrix .type-gin { color: var(--staged); font-weight: 600; }
  .matrix .type-brin { color: var(--merge); font-weight: 600; }
  .matrix .size-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
  }
  .badge-sm { background: rgba(126,231,184,0.15); color: var(--branch); }
  .badge-md { background: rgba(74,144,194,0.15); color: var(--accent); }
  .badge-lg { background: rgba(255,180,84,0.15); color: var(--merge); }
  .badge-tiny { background: rgba(200,168,255,0.15); color: var(--staged); }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s6">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">brin.sql</div>
    <div class="slide-num">06 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- #</span> brin index</div>
    <h2 style="font-size:46px;"><span style="color:var(--merge);">BRIN</span> — block range.<br>Tiny on disk. Time-series gold.</h2>

    <!-- SVG: page ranges with min/max -->
    <svg width="100%" viewBox="0 0 900 230" style="margin: 0 0 12px;">
      <!-- page blocks (physical table) -->
      <text x="130" y="20" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="13">heap (physical pages)</text>
      <text x="660" y="20" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="13">brin index entries</text>

      <!-- page range 1 (pages 0-127) -->
      <rect x="10" y="34" width="230" height="46" rx="6" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="125" y="52" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">pages 0 – 127</text>
      <text x="125" y="72" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="13">2025-01-01 … 2025-03-31</text>

      <!-- page range 2 -->
      <rect x="10" y="98" width="230" height="46" rx="6" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="125" y="116" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">pages 128 – 255</text>
      <text x="125" y="136" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="13">2025-04-01 … 2025-06-30</text>

      <!-- page range 3 -->
      <rect x="10" y="162" width="230" height="46" rx="6" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="125" y="180" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">pages 256 – 383</text>
      <text x="125" y="200" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="13">2025-07-01 … 2025-09-30</text>

      <!-- BRIN index boxes -->
      <rect x="460" y="34" width="390" height="46" rx="6" fill="#141d2e" stroke="#ffb454" stroke-width="1.5"/>
      <text x="560" y="52" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">range 0</text>
      <text x="750" y="52" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">min: 2025-01-01</text>
      <text x="750" y="70" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">max: 2025-03-31</text>

      <rect x="460" y="98" width="390" height="46" rx="6" fill="#141d2e" stroke="#ffb454" stroke-width="1.5"/>
      <text x="560" y="116" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">range 1</text>
      <text x="750" y="116" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">min: 2025-04-01</text>
      <text x="750" y="134" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13">max: 2025-06-30</text>

      <rect x="460" y="162" width="390" height="46" rx="6" fill="#141d2e" stroke="#36456a" stroke-width="1"/>
      <text x="560" y="180" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">range 2</text>
      <text x="750" y="180" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="13">min: 2025-07-01</text>
      <text x="750" y="198" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="13">max: 2025-09-30</text>

      <!-- connector arrows -->
      <line x1="242" y1="57" x2="458" y2="57" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="242" y1="121" x2="458" y2="121" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="242" y1="185" x2="458" y2="185" stroke="#36456a" stroke-width="1" stroke-dasharray="4 3"/>
    </svg>

    <pre style="font-size:17px; padding:16px 22px; margin:0;">
<span class="com">-- 128 pages → 1 index entry. Tiny!</span>
<span class="kw">WHERE</span> created_at > <span class="str">'2026-01-01'</span>  <span class="com">-- skips whole ranges ✓</span>
<span class="com">-- needs: data physically ordered by time</span></pre>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
