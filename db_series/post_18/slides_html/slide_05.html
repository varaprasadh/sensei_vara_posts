<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>UUID vs bigint — the index-page truth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;
    --merge: #ffb454;
    --conflict: #ff7a8a;
    --staged: #c8a8ff;
    --head: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  pre.xs { font-size: 15px; padding: 18px 22px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  .size-compare {
    display: flex;
    gap: 24px;
    margin: 16px 0 24px;
  }
  .size-box {
    flex: 1;
    background: var(--bg-elev);
    border-radius: 14px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border: 1px solid var(--border-strong);
  }
  .size-box.good { border-color: var(--branch); }
  .size-box.bad { border-color: var(--conflict); }
  .size-label { font-size: 20px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .size-num { font-size: 60px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
  .size-num.good { color: var(--branch); }
  .size-num.bad { color: var(--conflict); }
  .size-desc { font-size: 17px; color: var(--text-dim); line-height: 1.4; }

  .bench-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .bench-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    width: 100px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .bench-bar-wrap {
    flex: 1;
    background: var(--bg-elev);
    border-radius: 6px;
    height: 38px;
    overflow: hidden;
  }
  .bench-bar {
    height: 100%;
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding-left: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 600;
  }
  .bench-bar.bigint { background: rgba(126, 231, 184, 0.2); color: var(--branch); border: 1px solid var(--branch); width: 100%; }
  .bench-bar.uuidv7 { background: rgba(74, 144, 194, 0.2); color: var(--accent); border: 1px solid var(--accent); width: 92%; }
  .bench-bar.uuidv4 { background: rgba(255, 122, 138, 0.15); color: var(--conflict); border: 1px solid var(--conflict); width: 52%; }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s5">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">btree_uuid.sql</div>
    <div class="slide-num">05 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- #</span> uuidv4 inserts</div>
    <h2>Random → page splits<br><span style="color: var(--conflict);">everywhere</span>.</h2>
    <svg width="100%" viewBox="0 0 920 410" style="margin: 0 0 16px;">
      <defs>
        <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#4a90c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr-split" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#ff7a8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Root -->
      <rect x="340" y="20" width="240" height="52" rx="8" fill="#141d2e" stroke="#4a90c2" stroke-width="2"/>
      <text x="460" y="40" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="14">ROOT</text>
      <text x="460" y="58" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="12">00… … ff…</text>

      <!-- Internal left -->
      <rect x="80" y="130" width="210" height="52" rx="8" fill="#141d2e" stroke="#4a90c2" stroke-width="1.5"/>
      <text x="185" y="162" text-anchor="middle" fill="#93a3bf" font-family="JetBrains Mono, monospace" font-size="12">internal 00…–7f…</text>

      <!-- Internal right -->
      <rect x="630" y="130" width="210" height="52" rx="8" fill="#141d2e" stroke="#4a90c2" stroke-width="1.5"/>
      <text x="735" y="162" text-anchor="middle" fill="#93a3bf" font-family="JetBrains Mono, monospace" font-size="12">internal 80…–ff…</text>

      <line x1="420" y1="72" x2="250" y2="130" stroke="#4a90c2" stroke-width="1.5" marker-end="url(#arr-r)"/>
      <line x1="500" y1="72" x2="680" y2="130" stroke="#4a90c2" stroke-width="1.5" marker-end="url(#arr-r)"/>

      <!-- Leaf nodes — several split (coral) -->
      <rect x="20" y="258" width="120" height="58" rx="8" fill="rgba(255,122,138,0.12)" stroke="#ff7a8a" stroke-width="2"/>
      <text x="80" y="280" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="12">SPLIT</text>
      <text x="80" y="298" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="11">leaf</text>
      <text x="80" y="312" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="10">1c3e…</text>

      <rect x="155" y="258" width="120" height="58" rx="8" fill="#0e1626" stroke="#243049" stroke-width="1.5"/>
      <text x="215" y="284" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">leaf</text>
      <text x="215" y="300" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="10">2a7f…</text>

      <rect x="290" y="258" width="120" height="58" rx="8" fill="rgba(255,122,138,0.12)" stroke="#ff7a8a" stroke-width="2"/>
      <text x="350" y="280" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="12">SPLIT</text>
      <text x="350" y="298" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="11">leaf</text>
      <text x="350" y="312" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="10">4b12…</text>

      <rect x="425" y="258" width="120" height="58" rx="8" fill="rgba(255,122,138,0.12)" stroke="#ff7a8a" stroke-width="2"/>
      <text x="485" y="280" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="12">SPLIT</text>
      <text x="485" y="298" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="11">leaf</text>
      <text x="485" y="312" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="10">7d90…</text>

      <rect x="560" y="258" width="120" height="58" rx="8" fill="#0e1626" stroke="#243049" stroke-width="1.5"/>
      <text x="620" y="284" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">leaf</text>
      <text x="620" y="300" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="10">a3c4…</text>

      <rect x="695" y="258" width="120" height="58" rx="8" fill="rgba(255,122,138,0.12)" stroke="#ff7a8a" stroke-width="2"/>
      <text x="755" y="280" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="12">SPLIT</text>
      <text x="755" y="298" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="11">leaf</text>
      <text x="755" y="312" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="10">e8f1…</text>

      <!-- Arrows from insert pointing randomly -->
      <text x="460" y="360" text-anchor="middle" fill="#ff7a8a" font-family="JetBrains Mono, monospace" font-size="13">INSERT a9f3… → random page evicted from cache</text>
      <line x1="350" y1="355" x2="240" y2="316" stroke="#ff7a8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-split)"/>
      <line x1="570" y1="355" x2="700" y2="316" stroke="#ff7a8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-split)"/>
    </svg>
    <p class="body-text muted" style="font-size: 21px; margin: 0;"><span style="color: var(--conflict);">Every insert → different page</span>. Cold read from disk. B-tree bloat. Write throughput collapses.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
