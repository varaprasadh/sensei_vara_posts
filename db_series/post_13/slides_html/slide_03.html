<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>VACUUM — Why Your DB Takes Out the Trash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;
    --merge: #ffb454;
    --conflict: #ff7a8a;
    --staged: #c8a8ff;
    --head: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-content .conflict-text { color: var(--conflict); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Two-column layout */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; flex: 1; }
  .col-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .col-card.accent-border { border-color: var(--accent); }
  .col-card.conflict-border { border-color: var(--conflict); }
  .col-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .col-item { font-size: 20px; line-height: 1.5; color: var(--text-muted); padding-left: 20px; position: relative; }
  .col-item::before { content: "·"; position: absolute; left: 6px; color: var(--text-dim); }
  .col-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .col-badge.green { background: rgba(126,231,184,0.12); color: var(--branch); border: 1px solid rgba(126,231,184,0.3); }
  .col-badge.red { background: rgba(255,122,138,0.12); color: var(--conflict); border: 1px solid rgba(255,122,138,0.3); }

  /* Warning box */
  .warn-box {
    background: rgba(255,122,138,0.08);
    border: 1px solid var(--conflict);
    border-radius: 12px;
    padding: 28px 32px;
    margin-top: 16px;
  }
  .warn-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--conflict);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .warn-text { font-size: 22px; line-height: 1.5; color: var(--text); }

  /* SVG diagram area */
  .diagram-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>

          <text x="140" y="391" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#ff7a8a">row 7  (dead)</text>
        </svg>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 60px;">
        <div style="text-align: center;">
          <div style="font-size: 36px; color: var(--accent);">→</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent); margin-top: 6px;">VACUUM</div>
        </div>

      <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">

          <rect x="26" y="210" width="228" height="46" rx="6" fill="rgba(74,144,194,0.07)" stroke="#4a90c2" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="140" y="239" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#4a90c2">free space</text>

      </div>
    </div>
    <!-- Legend -->
    <div style="display: flex; gap: 24px; margin-top: 10px; align-items: center; justify-content: center;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 14px; height: 14px; border-radius: 3px; background: rgba(126,231,184,0.2); border: 1.5px solid #7ee7b8;"></div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--branch);">live tuple</span>

      <div style="display: flex; align-items: center; gap: 8px;">

      <div style="display: flex; align-items: center; gap: 8px;">

  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
