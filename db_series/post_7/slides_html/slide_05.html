<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Joins are Loops — DB Series #7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;          /* postgres blue */
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;          /* mint — success / index */
    --merge: #ffb454;           /* amber — highlight / sql kw */
    --conflict: #ff7a8a;        /* coral — errors */
    --staged: #c8a8ff;          /* lavender — refs */
    --head: #ffb454;            /* amber for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 26px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Decision table styles */
  .join-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
  }
  .join-table th {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    padding: 14px 18px;
    text-align: left;
    color: var(--text-muted);
    font-size: 15px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .join-table td {
    border: 1px solid var(--border);
    padding: 14px 18px;
    color: var(--text);
    line-height: 1.45;
    vertical-align: top;
  }
  .join-table tr:hover td { background: rgba(74, 144, 194, 0.05); }
  .join-table .row-label {
    font-weight: 600;
    white-space: nowrap;
  }
  .nl-label { color: var(--branch); }
  .hj-label { color: var(--merge); }
  .mj-label { color: var(--staged); }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s5">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">merge_join</div>
    <div class="slide-num">05 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- #</span> strategy 3 of 3</div>
    <h2>Merge Join<br><span style="color: var(--staged);">both sorted, walk in lockstep</span></h2>

    <svg width="100%" viewBox="0 0 920 400" style="display: block; margin: 0 0 16px;">
      <defs>
        <marker id="mj1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#c8a8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="mj2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#7ee7b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Column headers -->
      <text x="200" y="28" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">users (sorted by id)</text>
      <text x="720" y="28" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">orders (sorted by user_id)</text>

      <!-- Users rows (sorted) -->
      <rect x="120" y="44" width="160" height="42" rx="6" fill="#141d2e" stroke="#c8a8ff" stroke-width="2"/>
      <text x="200" y="62" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">id = 1</text>
      <text x="200" y="78" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">alice@…</text>

      <rect x="120" y="98" width="160" height="42" rx="6" fill="#141d2e" stroke="#c8a8ff" stroke-width="1.5"/>
      <text x="200" y="118" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="13">id = 2</text>
      <text x="200" y="134" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">bob@…</text>

      <rect x="120" y="152" width="160" height="42" rx="6" fill="#141d2e" stroke="#c8a8ff" stroke-width="1.5"/>
      <text x="200" y="172" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="13">id = 3</text>
      <text x="200" y="188" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">carol@…</text>

      <rect x="120" y="206" width="160" height="42" rx="6" fill="#141d2e" stroke="#c8a8ff" stroke-width="1.5"/>
      <text x="200" y="226" text-anchor="middle" fill="#c8a8ff" font-family="JetBrains Mono, monospace" font-size="13">id = 4</text>
      <text x="200" y="242" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">dave@…</text>

      <!-- sort indicator -->
      <text x="200" y="270" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">↑ sorted ASC</text>

      <!-- Orders rows (sorted) -->
      <rect x="640" y="44" width="160" height="42" rx="6" fill="#141d2e" stroke="#4a90c2" stroke-width="2"/>
      <text x="720" y="62" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">user_id = 1</text>
      <text x="720" y="78" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">$24.50</text>

      <rect x="640" y="98" width="160" height="42" rx="6" fill="#141d2e" stroke="#4a90c2" stroke-width="1.5"/>
      <text x="720" y="118" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="13">user_id = 1</text>
      <text x="720" y="134" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">$99.00</text>

      <rect x="640" y="152" width="160" height="42" rx="6" fill="#141d2e" stroke="#4a90c2" stroke-width="1.5"/>
      <text x="720" y="172" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="13">user_id = 3</text>
      <text x="720" y="188" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">$12.00</text>

      <rect x="640" y="206" width="160" height="42" rx="6" fill="#141d2e" stroke="#4a90c2" stroke-width="1.5"/>
      <text x="720" y="226" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="13">user_id = 4</text>
      <text x="720" y="242" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">$55.99</text>

      <text x="720" y="270" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12">↑ sorted ASC</text>

      <!-- Zipper arrows - matching rows -->
      <!-- id=1 ↔ user_id=1 match -->
      <line x1="282" y1="65" x2="638" y2="65" stroke="#7ee7b8" stroke-width="2.5"/>
      <polygon points="638,61 648,65 638,69" fill="#7ee7b8"/>
      <polygon points="282,61 272,65 282,69" fill="#7ee7b8"/>
      <text x="460" y="55" text-anchor="middle" fill="#7ee7b8" font-family="Inter, sans-serif" font-size="13" font-weight="600">match ✓</text>

      <!-- id=1 also matches orders row 2 -->
      <path d="M 282 65 Q 460 95 638 119" fill="none" stroke="#7ee7b8" stroke-width="1.5" stroke-dasharray="5 3"/>
      <polygon points="636,115 645,120 635,124" fill="#7ee7b8"/>

      <!-- id=3 ↔ user_id=3 match -->
      <line x1="282" y1="173" x2="638" y2="173" stroke="#7ee7b8" stroke-width="2.5"/>
      <polygon points="638,169 648,173 638,177" fill="#7ee7b8"/>
      <polygon points="282,169 272,173 282,177" fill="#7ee7b8"/>
      <text x="460" y="165" text-anchor="middle" fill="#7ee7b8" font-family="Inter, sans-serif" font-size="13" font-weight="600">match ✓</text>

      <!-- id=2 skipped (no orders) -->
      <text x="460" y="123" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="12" font-style="italic">advance A pointer</text>

      <!-- id=4 ↔ user_id=4 match -->
      <line x1="282" y1="227" x2="638" y2="227" stroke="#7ee7b8" stroke-width="2.5"/>
      <polygon points="638,223 648,227 638,231" fill="#7ee7b8"/>
      <polygon points="282,223 272,227 282,231" fill="#7ee7b8"/>

      <!-- Bottom note -->
      <text x="460" y="320" text-anchor="middle" fill="#c8a8ff" font-family="Inter, sans-serif" font-size="14" font-style="italic">both sides must be sorted — either naturally or via Sort node</text>
      <text x="460" y="345" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="13" font-style="italic">one pass through each side — O(n + m)</text>
    </svg>

    <div class="center-row" style="margin: 0; gap: 20px;">
      <div style="background: var(--bg-elev); border: 1px solid var(--staged); border-radius: 8px; padding: 12px 20px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--staged);">EXPLAIN: Merge Join</div>
      <div style="color: var(--text-muted); font-size: 18px;">Best for large + pre-sorted (index scan or sort node)</div>
    </div>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
