<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Joins are Loops — DB Series #7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;          /* postgres blue */
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;          /* mint — success / index */
    --merge: #ffb454;           /* amber — highlight / sql kw */
    --conflict: #ff7a8a;        /* coral — errors */
    --staged: #c8a8ff;          /* lavender — refs */
    --head: #ffb454;            /* amber for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 26px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Decision table styles */
  .join-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
  }
  .join-table th {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    padding: 14px 18px;
    text-align: left;
    color: var(--text-muted);
    font-size: 15px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .join-table td {
    border: 1px solid var(--border);
    padding: 14px 18px;
    color: var(--text);
    line-height: 1.45;
    vertical-align: top;
  }
  .join-table tr:hover td { background: rgba(74, 144, 194, 0.05); }
  .join-table .row-label {
    font-weight: 600;
    white-space: nowrap;
  }
  .nl-label { color: var(--branch); }
  .hj-label { color: var(--merge); }
  .mj-label { color: var(--staged); }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s4">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">hash_join</div>
    <div class="slide-num">04 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- #</span> strategy 2 of 3</div>
    <h2>Hash Join<br><span style="color: var(--merge);">build table, then probe</span></h2>

    <div style="display: flex; gap: 40px; align-items: flex-start; flex: 1; min-height: 0; margin-top: 8px;">
      <!-- SVG hash diagram -->
      <div style="flex: 1.1;">
        <svg width="100%" viewBox="0 0 420 380" style="display: block;">
          <defs>
            <marker id="hj1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M2 1L9 5L2 9" fill="none" stroke="#ffb454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
            <marker id="hj2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M2 1L9 5L2 9" fill="none" stroke="#4a90c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
          </defs>

          <!-- PHASE 1: Build -->
          <text x="80" y="22" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">PHASE 1: BUILD</text>
          <!-- small table (build side) -->
          <rect x="10" y="34" width="70" height="26" rx="4" fill="#141d2e" stroke="#ffb454" stroke-width="1.5"/>
          <text x="45" y="52" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12">users</text>
          <rect x="10" y="64" width="70" height="26" rx="4" fill="#141d2e" stroke="#36456a"/>
          <text x="45" y="82" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12">id=1</text>
          <rect x="10" y="94" width="70" height="26" rx="4" fill="#141d2e" stroke="#36456a"/>
          <text x="45" y="112" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12">id=2</text>
          <rect x="10" y="124" width="70" height="26" rx="4" fill="#141d2e" stroke="#36456a"/>
          <text x="45" y="142" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12">id=3</text>

          <!-- Arrow to hash table -->
          <line x1="82" y1="100" x2="128" y2="100" stroke="#ffb454" stroke-width="2" marker-end="url(#hj1)"/>
          <text x="105" y="92" text-anchor="middle" fill="#ffb454" font-family="Inter, sans-serif" font-size="11">hash(id)</text>

          <!-- Hash buckets -->
          <text x="230" y="22" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">HASH TABLE (memory)</text>
          <rect x="130" y="34" width="180" height="32" rx="4" fill="#141d2e" stroke="#ffb454" stroke-width="1.5"/>
          <text x="145" y="50" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">bucket 0:</text>
          <text x="215" y="50" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="11">id=3 →row</text>
          <rect x="130" y="70" width="180" height="32" rx="4" fill="#141d2e" stroke="#ffb454" stroke-width="1.5"/>
          <text x="145" y="86" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">bucket 1:</text>
          <text x="215" y="86" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="11">id=1 →row</text>
          <rect x="130" y="106" width="180" height="32" rx="4" fill="#141d2e" stroke="#ffb454" stroke-width="1.5"/>
          <text x="145" y="122" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="11">bucket 2:</text>
          <text x="215" y="122" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="11">id=2 →row</text>

          <!-- PHASE 2: Probe -->
          <line x1="210" y1="160" x2="210" y2="185" stroke="#36456a" stroke-width="1.5" stroke-dasharray="4 3"/>
          <text x="210" y="200" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">PHASE 2: PROBE</text>

          <!-- large table (probe side) -->
          <text x="60" y="225" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">orders (large)</text>
          <rect x="10" y="232" width="100" height="26" rx="4" fill="#141d2e" stroke="#4a90c2" stroke-width="1.5"/>
          <text x="60" y="250" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12">user_id=2</text>
          <rect x="10" y="262" width="100" height="26" rx="4" fill="#141d2e" stroke="#36456a"/>
          <text x="60" y="280" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12">user_id=1</text>
          <rect x="10" y="292" width="100" height="26" rx="4" fill="#141d2e" stroke="#36456a"/>
          <text x="60" y="310" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12">user_id=3</text>

          <!-- Probe arrows -->
          <line x1="112" y1="245" x2="128" y2="245" stroke="#4a90c2" stroke-width="1.5" marker-end="url(#hj2)"/>
          <line x1="112" y1="275" x2="128" y2="275" stroke="#4a90c2" stroke-width="1.5" marker-end="url(#hj2)"/>
          <line x1="112" y1="305" x2="128" y2="305" stroke="#4a90c2" stroke-width="1.5" marker-end="url(#hj2)"/>

          <!-- hash bucket probed -->
          <rect x="130" y="230" width="180" height="90" rx="4" fill="rgba(74,144,194,0.07)" stroke="#4a90c2" stroke-width="1.5"/>
          <text x="220" y="252" text-anchor="middle" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="12">hash(user_id)</text>
          <text x="220" y="274" text-anchor="middle" fill="#7ee7b8" font-family="JetBrains Mono, monospace" font-size="12">→ O(1) lookup</text>
          <text x="220" y="296" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12">emit match</text>

          <text x="210" y="350" text-anchor="middle" fill="#6a7a98" font-family="Inter, sans-serif" font-size="12" font-style="italic">needs work_mem to hold hash table</text>
        </svg>
      </div>
      <!-- note -->
      <div style="flex: 0.9; display: flex; flex-direction: column; gap: 14px; padding-top: 10px;">
        <div style="background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: 10px; padding: 16px 20px;">
          <div style="color: var(--merge); font-family: 'JetBrains Mono', monospace; font-size: 14px; margin-bottom: 8px;">BEST WHEN</div>
          <div style="color: var(--text); font-size: 16px; line-height: 1.5;">large tables<br>no useful index<br>equality join (=)</div>
        </div>
        <div style="background: var(--bg-elev); border: 1px solid var(--conflict); border-radius: 10px; padding: 16px 20px;">
          <div style="color: var(--conflict); font-family: 'JetBrains Mono', monospace; font-size: 14px; margin-bottom: 8px;">WATCH OUT</div>
          <div style="color: var(--text-muted); font-size: 16px; line-height: 1.5;">hash table spills<br>to disk if<br>work_mem too small</div>
        </div>
        <div style="background: var(--bg-code); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;">
          <div style="color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-bottom: 4px;">EXPLAIN label</div>
          <div style="color: var(--merge); font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600;">Hash Join</div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
