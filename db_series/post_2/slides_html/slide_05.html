<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Pages — the 8KB Atom — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-elev: #141d2e;
    --bg-code: #0e1626;
    --border: #243049;
    --border-strong: #36456a;
    --text: #e6edf3;
    --text-muted: #93a3bf;
    --text-dim: #6a7a98;
    --accent: #4a90c2;          /* postgres blue */
    --accent-soft: rgba(74, 144, 194, 0.15);
    --branch: #7ee7b8;          /* mint — success / index */
    --merge: #ffb454;           /* amber — highlight / sql kw */
    --conflict: #ff7a8a;        /* coral — errors */
    --staged: #c8a8ff;          /* lavender — refs */
    --head: #ffb454;            /* amber for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(110, 130, 170, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 130, 170, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 26px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s5">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">ctid.sql</div>
    <div class="slide-num">05 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">-- </span> table file = sequence of pages</div>
    <h2>CTID = <span style="color: var(--merge);">(page, item)</span><br>the exact address.</h2>

    <svg width="100%" viewBox="0 0 920 430" style="margin: 4px 0 12px;">
      <defs>
        <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#4a90c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#ffb454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Table file label -->
      <text x="60" y="30" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="14">users (table file on disk)</text>

      <!-- Pages stacked vertically -->
      <!-- Page 0 -->
      <rect x="60" y="44" width="300" height="72" rx="4" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="76" y="76" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="13">Page 0</text>
      <text x="200" y="76" fill="#93a3bf" font-family="JetBrains Mono, monospace" font-size="13">8 KB · rows 1–42</text>
      <text x="76" y="100" fill="#4a7090" font-family="JetBrains Mono, monospace" font-size="12">offset 0x000000</text>

      <!-- Page 1 -->
      <rect x="60" y="120" width="300" height="72" rx="4" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="76" y="152" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="13">Page 1</text>
      <text x="200" y="152" fill="#93a3bf" font-family="JetBrains Mono, monospace" font-size="13">8 KB · rows 43–85</text>
      <text x="76" y="175" fill="#4a7090" font-family="JetBrains Mono, monospace" font-size="12">offset 0x002000</text>

      <!-- Page 2 -->
      <rect x="60" y="196" width="300" height="72" rx="4" fill="#141d2e" stroke="#36456a" stroke-width="1.5"/>
      <text x="76" y="228" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="13">Page 2</text>
      <text x="200" y="228" fill="#93a3bf" font-family="JetBrains Mono, monospace" font-size="13">8 KB · rows 86–121</text>
      <text x="76" y="252" fill="#4a7090" font-family="JetBrains Mono, monospace" font-size="12">offset 0x004000</text>

      <!-- Page 3 HIGHLIGHTED -->
      <rect x="60" y="272" width="300" height="72" rx="4" fill="#1a2c40" stroke="#4a90c2" stroke-width="2.5"/>
      <text x="76" y="304" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">Page 3</text>
      <text x="200" y="304" fill="#93a3bf" font-family="JetBrains Mono, monospace" font-size="13">8 KB · rows 122–163</text>
      <text x="76" y="326" fill="#4a7090" font-family="JetBrains Mono, monospace" font-size="12">offset 0x006000</text>

      <!-- Dots -->
      <text x="200" y="370" text-anchor="middle" fill="#36456a" font-family="JetBrains Mono, monospace" font-size="20">···</text>
      <text x="200" y="408" fill="#36456a" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13">N pages total</text>

      <!-- Arrow pointing into Page 3 -->
      <line x1="520" y1="308" x2="365" y2="308" stroke="#ffb454" stroke-width="2.5" marker-end="url(#arr3)"/>

      <!-- CTID box -->
      <rect x="530" y="250" width="330" height="130" rx="8" fill="#1e2a1a" stroke="#ffb454" stroke-width="2"/>
      <text x="695" y="283" text-anchor="middle" fill="#ffb454" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">CTID = (3, 7)</text>
      <text x="695" y="308" text-anchor="middle" fill="#93a3bf" font-family="Inter, sans-serif" font-size="15">page number = 3</text>
      <text x="695" y="330" text-anchor="middle" fill="#93a3bf" font-family="Inter, sans-serif" font-size="15">item pointer index = 7</text>
      <text x="695" y="358" text-anchor="middle" fill="#6a7a98" font-family="JetBrains Mono, monospace" font-size="13">physical row address in heap</text>

      <!-- Side label -->
      <text x="530" y="100" fill="#6a7a98" font-family="Inter, sans-serif" font-size="15">Every row has a CTID.</text>
      <text x="530" y="122" fill="#6a7a98" font-family="Inter, sans-serif" font-size="15">Index entries store CTIDs</text>
      <text x="530" y="144" fill="#6a7a98" font-family="Inter, sans-serif" font-size="15">as their leaf values.</text>
      <text x="530" y="180" fill="#4a90c2" font-family="JetBrains Mono, monospace" font-size="14">page · item → row</text>
    </svg>

    <p class="body-text muted" style="font-size: 20px; margin: 0;">Index lookup returns <span style="color: var(--merge); font-family: 'JetBrains Mono', monospace;">CTID</span>. Then Postgres loads that page. One I/O.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
