<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Event Loop Phases — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a140d;
    --bg-elev: #122019;
    --bg-code: #0c1810;
    --border: #1f3024;
    --border-strong: #2f4a37;
    --text: #e8f0e8;
    --text-muted: #9bb3a0;
    --text-dim: #6c8275;
    --accent: #68a063;          /* node green */
    --accent-soft: rgba(104, 160, 99, 0.15);
    --branch: #c8f573;          /* neon lime — highlight */
    --merge: #ffd166;           /* gold — numbers / refs */
    --conflict: #ff6b6b;        /* red — errors */
    --staged: #93dcff;          /* sky — special */
    --head: #ffd166;            /* gold for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120, 170, 130, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 130, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  pre.xs { font-size: 15px; padding: 18px 22px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--branch); padding-left: 10px; margin-left: -13px; display: block; }
  .hi-gold { background: rgba(255, 209, 102, 0.12); border-left: 3px solid var(--merge); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 25px; line-height: 1.55;
    color: var(--text);
    margin-bottom: 16px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s6">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">microtasks.js</div>
    <div class="slide-num">06 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">// </span> between every phase</div>
    <h2 style="font-size: 46px; margin-bottom: 18px;">Microtasks don't wait<br><span style="color: var(--branch);">for the next phase</span>.</h2>

    <svg width="100%" viewBox="0 0 860 320" style="margin: 0 auto 20px; display: block;">
      <defs>
        <marker id="mt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#68a063" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="mt-arr-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#c8f573" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Phase box 1 -->
      <rect x="30" y="120" width="140" height="60" rx="8" fill="#122019" stroke="#68a063" stroke-width="1.5"/>
      <text x="100" y="156" text-anchor="middle" fill="#68a063" font-family="JetBrains Mono, monospace" font-size="14">phase N</text>

      <!-- Drain zone -->
      <rect x="200" y="90" width="200" height="120" rx="10" fill="rgba(200,245,115,0.06)" stroke="#c8f573" stroke-width="1.8" stroke-dasharray="5 3"/>
      <text x="300" y="116" text-anchor="middle" fill="#c8f573" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">DRAIN</text>
      <rect x="216" y="126" width="168" height="32" rx="6" fill="#122019" stroke="#ffd166" stroke-width="1.2"/>
      <text x="300" y="148" text-anchor="middle" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="12">① nextTick queue</text>
      <rect x="216" y="164" width="168" height="32" rx="6" fill="#122019" stroke="#93dcff" stroke-width="1.2"/>
      <text x="300" y="186" text-anchor="middle" fill="#93dcff" font-family="JetBrains Mono, monospace" font-size="12">② Promise queue</text>
      <text x="300" y="216" text-anchor="middle" fill="#c8f573" font-family="Inter, sans-serif" font-size="11" font-style="italic">fully empty before next phase</text>

      <!-- Phase box 2 -->
      <rect x="430" y="120" width="140" height="60" rx="8" fill="#122019" stroke="#68a063" stroke-width="1.5"/>
      <text x="500" y="156" text-anchor="middle" fill="#68a063" font-family="JetBrains Mono, monospace" font-size="14">phase N+1</text>

      <!-- Drain zone again -->
      <rect x="600" y="90" width="200" height="120" rx="10" fill="rgba(200,245,115,0.06)" stroke="#c8f573" stroke-width="1.8" stroke-dasharray="5 3"/>
      <text x="700" y="116" text-anchor="middle" fill="#c8f573" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">DRAIN</text>
      <rect x="616" y="126" width="168" height="32" rx="6" fill="#122019" stroke="#ffd166" stroke-width="1.2"/>
      <text x="700" y="148" text-anchor="middle" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="12">① nextTick queue</text>
      <rect x="616" y="164" width="168" height="32" rx="6" fill="#122019" stroke="#93dcff" stroke-width="1.2"/>
      <text x="700" y="186" text-anchor="middle" fill="#93dcff" font-family="JetBrains Mono, monospace" font-size="12">② Promise queue</text>

      <!-- arrows -->
      <line x1="170" y1="150" x2="198" y2="150" stroke="#68a063" stroke-width="1.8" marker-end="url(#mt-arr)"/>
      <line x1="400" y1="150" x2="428" y2="150" stroke="#68a063" stroke-width="1.8" marker-end="url(#mt-arr)"/>
      <line x1="570" y1="150" x2="598" y2="150" stroke="#68a063" stroke-width="1.8" marker-end="url(#mt-arr)"/>

      <!-- "ALWAYS" label -->
      <text x="300" y="260" text-anchor="middle" fill="#c8f573" font-family="Inter, sans-serif" font-size="16" font-weight="700">ALWAYS drain before next phase</text>
    </svg>

    <p class="body-text" style="font-size: 22px; margin: 0 0 12px;">Order: <span style="color: var(--merge); font-family: 'JetBrains Mono', monospace;">nextTick</span> drains first, then <span style="color: var(--staged); font-family: 'JetBrains Mono', monospace;">Promise</span> microtasks, then next phase starts.</p>
    <p class="body-text muted" style="font-size: 20px; margin: 0;">Starve the microtask queue → block the loop. Don't <span style="color: var(--conflict);">recurse nextTick</span>.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
