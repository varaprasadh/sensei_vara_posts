<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Call Stack vs Event Queue — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a140d;
    --bg-elev: #122019;
    --bg-code: #0c1810;
    --border: #1f3024;
    --border-strong: #2f4a37;
    --text: #e8f0e8;
    --text-muted: #9bb3a0;
    --text-dim: #6c8275;
    --accent: #68a063;          /* node green */
    --accent-soft: rgba(104, 160, 99, 0.15);
    --branch: #c8f573;          /* neon lime — highlight */
    --merge: #ffd166;           /* gold — numbers / refs */
    --conflict: #ff6b6b;        /* red — errors */
    --staged: #93dcff;          /* sky — special */
    --head: #ffd166;            /* gold for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120, 170, 130, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 130, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }
  .hi-red { background: rgba(255, 107, 107, 0.12); border-left: 3px solid var(--conflict); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 26px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s3">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">event_loop.c</div>
    <div class="slide-num">03 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">$ #</span> the classic picture</div>
    <h2 style="font-size: 44px; margin-bottom: 16px;">Stack + Queue + Loop</h2>

    <svg width="100%" viewBox="0 0 920 560" style="margin: 0 0 16px;">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#68a063" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#ffd166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- CALL STACK (left side, vertical) -->
      <text x="130" y="30" text-anchor="middle" fill="#e8f0e8" font-family="Inter, sans-serif" font-size="18" font-weight="700">CALL STACK</text>
      <!-- stack frames (bottom = active) -->
      <rect x="30" y="370" width="200" height="52" rx="6" fill="#122019" stroke="#68a063" stroke-width="2"/>
      <text x="130" y="401" text-anchor="middle" fill="#c8f573" font-family="JetBrains Mono, monospace" font-size="16">main()</text>
      <rect x="30" y="308" width="200" height="52" rx="6" fill="#122019" stroke="#2f4a37" stroke-width="1.5"/>
      <text x="130" y="339" text-anchor="middle" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="16">console.log</text>
      <rect x="30" y="246" width="200" height="52" rx="6" fill="#122019" stroke="#2f4a37" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="130" y="277" text-anchor="middle" fill="#6c8275" font-family="JetBrains Mono, monospace" font-size="15">...</text>
      <!-- stack boundary label -->
      <text x="130" y="450" text-anchor="middle" fill="#6c8275" font-family="Inter, sans-serif" font-size="13" font-style="italic">← grows up (LIFO)</text>
      <!-- vertical spine -->
      <line x1="30" y1="60" x2="30" y2="430" stroke="#2f4a37" stroke-width="1.5"/>
      <line x1="230" y1="60" x2="230" y2="430" stroke="#2f4a37" stroke-width="1.5"/>
      <line x1="30" y1="430" x2="230" y2="430" stroke="#2f4a37" stroke-width="1.5"/>

      <!-- EVENT LOOP (center) -->
      <circle cx="460" cy="280" r="80" fill="#0a140d" stroke="#68a063" stroke-width="2.5"/>
      <text x="460" y="272" text-anchor="middle" fill="#68a063" font-family="Inter, sans-serif" font-size="16" font-weight="700">event</text>
      <text x="460" y="295" text-anchor="middle" fill="#68a063" font-family="Inter, sans-serif" font-size="16" font-weight="700">loop</text>
      <!-- loop condition label -->
      <text x="460" y="400" text-anchor="middle" fill="#9bb3a0" font-family="Inter, sans-serif" font-size="13" font-style="italic">stack empty?</text>
      <text x="460" y="418" text-anchor="middle" fill="#c8f573" font-family="JetBrains Mono, monospace" font-size="13">→ pull from queue</text>

      <!-- CALLBACK QUEUE (right side, horizontal) -->
      <text x="720" y="30" text-anchor="middle" fill="#e8f0e8" font-family="Inter, sans-serif" font-size="18" font-weight="700">CALLBACK QUEUE</text>
      <rect x="580" y="120" width="130" height="52" rx="6" fill="#122019" stroke="#93dcff" stroke-width="1.5"/>
      <text x="645" y="151" text-anchor="middle" fill="#93dcff" font-family="JetBrains Mono, monospace" font-size="14">cb_A</text>
      <rect x="720" y="120" width="130" height="52" rx="6" fill="#122019" stroke="#93dcff" stroke-width="1.5"/>
      <text x="785" y="151" text-anchor="middle" fill="#93dcff" font-family="JetBrains Mono, monospace" font-size="14">cb_B</text>
      <!-- queue arrow direction -->
      <line x1="580" y1="146" x2="560" y2="146" stroke="#93dcff" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="720" y="195" text-anchor="middle" fill="#6c8275" font-family="Inter, sans-serif" font-size="13" font-style="italic">← dequeued (FIFO)</text>

      <!-- LIBUV / WEB APIs box -->
      <rect x="570" y="340" width="300" height="80" rx="8" fill="#0c1810" stroke="#2f4a37" stroke-width="1.5"/>
      <text x="720" y="374" text-anchor="middle" fill="#ffd166" font-family="Inter, sans-serif" font-size="16" font-weight="600">libuv / async APIs</text>
      <text x="720" y="398" text-anchor="middle" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="13">setTimeout · fs · fetch · dns</text>

      <!-- Arrows -->
      <!-- stack → loop: "check" -->
      <line x1="230" y1="300" x2="375" y2="280" stroke="#68a063" stroke-width="2" marker-end="url(#arr)"/>
      <text x="296" y="278" text-anchor="middle" fill="#68a063" font-family="Inter, sans-serif" font-size="13">checks</text>

      <!-- loop → stack: "push cb" -->
      <path d="M390 250 Q310 200 230 260" fill="none" stroke="#ffd166" stroke-width="2" marker-end="url(#arr-gold)"/>
      <text x="308" y="208" text-anchor="middle" fill="#ffd166" font-family="Inter, sans-serif" font-size="13">push cb</text>

      <!-- queue → loop -->
      <line x1="580" y1="160" x2="540" y2="230" stroke="#93dcff" stroke-width="2" marker-end="url(#arr)"/>
      <text x="576" y="200" text-anchor="middle" fill="#93dcff" font-family="Inter, sans-serif" font-size="13">enqueue</text>

      <!-- async API → queue -->
      <line x1="640" y1="340" x2="640" y2="176" stroke="#9bb3a0" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>

      <!-- stack → libuv (handoff) -->
      <path d="M200 380 Q400 500 570 390" fill="none" stroke="#ff6b6b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>
      <text x="385" y="500" text-anchor="middle" fill="#ff6b6b" font-family="Inter, sans-serif" font-size="13">handoff (non-blocking)</text>
    </svg>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
