<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>await in a loop = sequential — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a140d;
    --bg-elev: #122019;
    --bg-code: #0c1810;
    --border: #1f3024;
    --border-strong: #2f4a37;
    --text: #e8f0e8;
    --text-muted: #9bb3a0;
    --text-dim: #6c8275;
    --accent: #68a063;          /* node green */
    --accent-soft: rgba(104, 160, 99, 0.15);
    --branch: #c8f573;          /* neon lime — highlight */
    --merge: #ffd166;           /* gold — numbers / refs */
    --conflict: #ff6b6b;        /* red — errors */
    --staged: #93dcff;          /* sky — special */
    --head: #ffd166;            /* gold for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120, 170, 130, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 130, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  pre.xs { font-size: 15px; padding: 18px 22px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: rgba(255, 107, 107, 0.15); border-left: 3px solid var(--conflict); padding-left: 10px; margin-left: -13px; display: block; }
  .hi-lime { background: rgba(200, 245, 115, 0.12); border-left: 3px solid var(--branch); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-content .red-text { color: var(--conflict); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 16px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .recap-list .key.red { color: var(--conflict); }
  .recap-list .key.lime { color: var(--branch); }
  .recap-list .key.gold { color: var(--merge); }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s5">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">parallel.js</div>
    <div class="slide-num">05 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">$ #</span> the new problem</div>
    <h2>10,000 urls.<br><span style="color:var(--conflict)">Your DB cries.</span></h2>
    <p class="lede"><span style="font-family:'JetBrains Mono',monospace; color:var(--merge)">Promise.all</span> with 10k items fires <span style="color:var(--conflict)">10,000 concurrent connections</span>. Your DB/API has a connection pool. You just nuked it.</p>

    <!-- SVG: server overwhelmed diagram -->
    <svg width="100%" viewBox="0 0 880 260" style="margin: 8px 0 0;">
      <defs>
        <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Node process box -->
      <rect x="20" y="80" width="160" height="100" rx="8" fill="#122019" stroke="#2f4a37" stroke-width="1.5"/>
      <text x="100" y="126" text-anchor="middle" fill="#e8f0e8" font-family="Inter, sans-serif" font-size="14" font-weight="600">Node process</text>
      <text x="100" y="148" text-anchor="middle" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="12">10,000 promises</text>

      <!-- Arrows to server — many arrows, red -->
      <line x1="180" y1="108" x2="450" y2="90"  stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arr5)" opacity="0.9"/>
      <line x1="180" y1="118" x2="450" y2="110" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arr5)" opacity="0.85"/>
      <line x1="180" y1="128" x2="450" y2="130" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arr5)" opacity="0.80"/>
      <line x1="180" y1="138" x2="450" y2="150" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arr5)" opacity="0.75"/>
      <line x1="180" y1="148" x2="450" y2="170" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arr5)" opacity="0.70"/>
      <line x1="180" y1="155" x2="450" y2="190" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arr5)" opacity="0.65"/>
      <text x="310" y="72" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="11">× 10,000 concurrent</text>

      <!-- Server / DB box -->
      <rect x="450" y="60" width="180" height="160" rx="8" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="2"/>
      <text x="540" y="106" text-anchor="middle" fill="#ff6b6b" font-family="Inter, sans-serif" font-size="15" font-weight="700">DB / API</text>
      <text x="540" y="132" text-anchor="middle" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="12">max_connections:</text>
      <text x="540" y="152" text-anchor="middle" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">100</text>
      <text x="540" y="198" text-anchor="middle" fill="#ff6b6b" font-family="Inter, sans-serif" font-size="13" font-style="italic">9,900 rejected ✗</text>

      <!-- Error label -->
      <rect x="660" y="105" width="200" height="70" rx="8" fill="#1a0d0d" stroke="#ff6b6b" stroke-width="1.5"/>
      <text x="760" y="137" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="13">ECONNREFUSED</text>
      <text x="760" y="158" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="13">too many clients</text>
    </svg>

    <p style="margin:0; font-size:20px; color:var(--conflict); font-family:'JetBrains Mono',monospace; text-align:center;">Unbounded parallel = self-DoS. You fixed latency, broke everything else.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
