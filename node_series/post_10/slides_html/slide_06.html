<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>await in a loop = sequential — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a140d;
    --bg-elev: #122019;
    --bg-code: #0c1810;
    --border: #1f3024;
    --border-strong: #2f4a37;
    --text: #e8f0e8;
    --text-muted: #9bb3a0;
    --text-dim: #6c8275;
    --accent: #68a063;          /* node green */
    --accent-soft: rgba(104, 160, 99, 0.15);
    --branch: #c8f573;          /* neon lime — highlight */
    --merge: #ffd166;           /* gold — numbers / refs */
    --conflict: #ff6b6b;        /* red — errors */
    --staged: #93dcff;          /* sky — special */
    --head: #ffd166;            /* gold for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120, 170, 130, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 130, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  pre.xs { font-size: 15px; padding: 18px 22px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: rgba(255, 107, 107, 0.15); border-left: 3px solid var(--conflict); padding-left: 10px; margin-left: -13px; display: block; }
  .hi-lime { background: rgba(200, 245, 115, 0.12); border-left: 3px solid var(--branch); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-content .red-text { color: var(--conflict); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 16px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .recap-list .key.red { color: var(--conflict); }
  .recap-list .key.lime { color: var(--branch); }
  .recap-list .key.gold { color: var(--merge); }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s6">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">p_limit.js</div>
    <div class="slide-num">06 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">$ #</span> bounded concurrency — p-limit</div>
    <h2>Max 8 at a time.<br><span style="color:var(--branch)">Safe and fast.</span></h2>
<pre class="sm"><span class="kw">import</span> <span class="fn">pLimit</span> <span class="kw">from</span> <span class="str">'p-limit'</span>;

<span class="kw">const</span> <span class="var">limit</span> = <span class="fn">pLimit</span>(<span class="num">8</span>);            <span class="com">// max 8 concurrent</span>
<span class="hi-lime">
<span class="kw">const</span> <span class="var">results</span> = <span class="kw">await</span> <span class="fn">Promise</span>.<span class="fn">all</span>(
  <span class="var">urls</span>.<span class="fn">map</span>(<span class="var">url</span> =&gt; <span class="fn">limit</span>(() =&gt; <span class="fn">fetch</span>(<span class="var">url</span>)))
);</span></pre>

    <!-- SVG: 8-lane batched timeline -->
    <svg width="100%" viewBox="0 0 880 180" style="margin: 0;">
      <text x="0" y="16" fill="#6c8275" font-family="JetBrains Mono, monospace" font-size="12">8 lanes — each fills as prev completes, queue drains safely</text>
      <g transform="translate(0,24)">
        <!-- Lane labels -->
        <text x="0"  y="18" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">lane 1</text>
        <text x="0"  y="36" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">lane 2</text>
        <text x="0"  y="54" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">lane 3</text>
        <text x="0"  y="72" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">lane 4</text>
        <text x="0"  y="90" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">lane 5</text>
        <text x="0"  y="108" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">lane 6</text>
        <text x="0"  y="126" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">lane 7</text>
        <text x="0"  y="144" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">lane 8</text>

        <!-- Bars: each lane has sequential bars (showing batched behavior) -->
        <!-- Lane 1: 3 batches -->
        <rect x="56" y="4"   width="70" height="12" rx="2" fill="#c8f573" opacity="0.85"/>
        <rect x="130" y="4"  width="70" height="12" rx="2" fill="#c8f573" opacity="0.75"/>
        <rect x="204" y="4"  width="70" height="12" rx="2" fill="#c8f573" opacity="0.65"/>
        <rect x="278" y="4"  width="70" height="12" rx="2" fill="#ffd166" opacity="0.6"/>

        <rect x="56" y="22"  width="70" height="12" rx="2" fill="#c8f573" opacity="0.85"/>
        <rect x="130" y="22" width="70" height="12" rx="2" fill="#c8f573" opacity="0.75"/>
        <rect x="204" y="22" width="70" height="12" rx="2" fill="#c8f573" opacity="0.65"/>
        <rect x="278" y="22" width="70" height="12" rx="2" fill="#ffd166" opacity="0.6"/>

        <rect x="56" y="40"  width="70" height="12" rx="2" fill="#c8f573" opacity="0.85"/>
        <rect x="130" y="40" width="70" height="12" rx="2" fill="#c8f573" opacity="0.75"/>
        <rect x="204" y="40" width="70" height="12" rx="2" fill="#c8f573" opacity="0.65"/>

        <rect x="56" y="58"  width="70" height="12" rx="2" fill="#c8f573" opacity="0.85"/>
        <rect x="130" y="58" width="70" height="12" rx="2" fill="#c8f573" opacity="0.75"/>
        <rect x="204" y="58" width="70" height="12" rx="2" fill="#ffd166" opacity="0.6"/>

        <rect x="56" y="76"  width="70" height="12" rx="2" fill="#c8f573" opacity="0.85"/>
        <rect x="130" y="76" width="70" height="12" rx="2" fill="#c8f573" opacity="0.75"/>
        <rect x="204" y="76" width="70" height="12" rx="2" fill="#c8f573" opacity="0.65"/>

        <rect x="56" y="94"  width="70" height="12" rx="2" fill="#c8f573" opacity="0.85"/>
        <rect x="130" y="94" width="70" height="12" rx="2" fill="#c8f573" opacity="0.75"/>
        <rect x="204" y="94" width="70" height="12" rx="2" fill="#ffd166" opacity="0.6"/>

        <rect x="56" y="112" width="70" height="12" rx="2" fill="#c8f573" opacity="0.85"/>
        <rect x="130" y="112" width="70" height="12" rx="2" fill="#c8f573" opacity="0.75"/>
        <rect x="204" y="112" width="70" height="12" rx="2" fill="#c8f573" opacity="0.65"/>

        <rect x="56" y="130" width="70" height="12" rx="2" fill="#c8f573" opacity="0.85"/>
        <rect x="130" y="130" width="70" height="12" rx="2" fill="#c8f573" opacity="0.75"/>
        <rect x="204" y="130" width="70" height="12" rx="2" fill="#ffd166" opacity="0.6"/>

        <!-- end marker -->
        <line x1="352" y1="0" x2="352" y2="145" stroke="#68a063" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
        <text x="358" y="70" fill="#68a063" font-family="Inter, sans-serif" font-size="13" font-weight="600">done ✓</text>
        <text x="358" y="90" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">~650ms</text>
        <text x="358" y="108" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">not 50ms but</text>
        <text x="358" y="124" fill="#9bb3a0" font-family="JetBrains Mono, monospace" font-size="11">not 5s either</text>
      </g>
    </svg>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
