<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>node_modules Resolution — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a140d;
    --bg-elev: #122019;
    --bg-code: #0c1810;
    --border: #1f3024;
    --border-strong: #2f4a37;
    --text: #e8f0e8;
    --text-muted: #9bb3a0;
    --text-dim: #6c8275;
    --accent: #68a063;          /* node green */
    --accent-soft: rgba(104, 160, 99, 0.15);
    --branch: #c8f573;          /* neon lime — highlight */
    --merge: #ffd166;           /* gold — numbers / refs */
    --conflict: #ff6b6b;        /* red — errors */
    --staged: #93dcff;          /* sky — special */
    --head: #ffd166;            /* gold for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120, 170, 130, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 130, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.head { border-color: var(--head); color: var(--head); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s5">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">resolution.js</div>
    <div class="slide-num">05 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">$ #</span> two kinds of specifier</div>
    <h2><span style="color:var(--branch);">./foo</span> vs <span style="color:var(--merge);">'react'</span>.<br>Different rules.</h2>

    <svg width="100%" viewBox="0 0 920 440" style="margin: 4px 0 12px;">
      <defs>
        <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#6c8275" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- LEFT: RELATIVE -->
      <rect x="10" y="10" width="420" height="420" rx="10" fill="#0c1810" stroke="#2f4a37" stroke-width="1.5"/>

      <text x="220" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6c8275">relative — no node_modules walk</text>

      <rect x="30" y="86" width="380" height="36" rx="6" fill="#122019" stroke="#2f4a37"/>

      <rect x="30" y="148" width="380" height="36" rx="6" fill="#122019" stroke="#2f4a37"/>
      <text x="220" y="172" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#9bb3a0">./foo.json</text>

      <line x1="220" y1="184" x2="220" y2="210" stroke="#6c8275" stroke-width="1.5" marker-end="url(#arb)" stroke-dasharray="3 3"/>

      <rect x="30" y="210" width="380" height="36" rx="6" fill="#122019" stroke="#2f4a37"/>
      <text x="220" y="234" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#9bb3a0">./foo.node</text>

      <line x1="220" y1="246" x2="220" y2="272" stroke="#6c8275" stroke-width="1.5" marker-end="url(#arb)" stroke-dasharray="3 3"/>

      <rect x="30" y="272" width="380" height="36" rx="6" fill="#122019" stroke="#2f4a37"/>
      <text x="220" y="296" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#9bb3a0">./foo/index.js</text>

      <line x1="220" y1="308" x2="220" y2="334" stroke="#6c8275" stroke-width="1.5" marker-end="url(#arb)" stroke-dasharray="3 3"/>

      <rect x="30" y="334" width="380" height="36" rx="6" fill="#ff6b6b11" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5 3"/>
      <text x="220" y="358" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#ff6b6b">MODULE_NOT_FOUND</text>

      <!-- RIGHT: BARE -->
      <rect x="490" y="10" width="420" height="420" rx="10" fill="#0c1810" stroke="#2f4a37" stroke-width="1.5"/>
      <text x="700" y="46" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" fill="#ffd166">require('react')</text>
      <text x="700" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6c8275">bare — walks up node_modules</text>

      <rect x="510" y="86" width="380" height="36" rx="6" fill="#122019" stroke="#2f4a37"/>
      <text x="700" y="110" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#9bb3a0">./node_modules/react/</text>

      <line x1="700" y1="122" x2="700" y2="148" stroke="#6c8275" stroke-width="1.5" marker-end="url(#arb)" stroke-dasharray="3 3"/>

      <rect x="510" y="148" width="380" height="36" rx="6" fill="#122019" stroke="#2f4a37"/>
      <text x="700" y="172" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#9bb3a0">../node_modules/react/</text>

      <line x1="700" y1="184" x2="700" y2="210" stroke="#6c8275" stroke-width="1.5" marker-end="url(#arb)" stroke-dasharray="3 3"/>

      <rect x="510" y="210" width="380" height="52" rx="6" fill="#122019" stroke="#68a063" stroke-width="2"/>
      <text x="700" y="230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#e8f0e8">../../node_modules/react/</text>
      <text x="700" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#68a063">✓ found → read package.json</text>

      <text x="700" y="310" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6c8275" font-style="italic">…and so on until /</text>
    </svg>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
