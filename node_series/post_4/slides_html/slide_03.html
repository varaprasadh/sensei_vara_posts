<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Microtasks vs Macrotasks — Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a140d;
    --bg-elev: #122019;
    --bg-code: #0c1810;
    --border: #1f3024;
    --border-strong: #2f4a37;
    --text: #e8f0e8;
    --text-muted: #9bb3a0;
    --text-dim: #6c8275;
    --accent: #68a063;          /* node green */
    --accent-soft: rgba(104, 160, 99, 0.15);
    --branch: #c8f573;          /* neon lime — highlight */
    --merge: #ffd166;           /* gold — numbers / refs */
    --conflict: #ff6b6b;        /* red — errors */
    --staged: #93dcff;          /* sky — special */
    --head: #ffd166;            /* gold for HEAD-like emphasis */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #04070b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .controls { position: fixed; top: 16px; right: 16px; z-index: 100; }
  .controls button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .slide {
    width: 1080px; height: 1080px;
    background: var(--bg);
    position: relative; overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    padding: 70px 80px;
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120, 170, 130, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 130, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; position: relative; z-index: 1; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tab {
    margin-left: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .slide-num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    position: relative; z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }
  .footer .handle { color: var(--text-muted); }
  .footer .swipe { color: var(--accent); }

  h1 { font-size: 80px; font-weight: 800; line-height: 1.05; margin: 0 0 24px; letter-spacing: -0.02em; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.015em; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .label .prompt { color: var(--text-dim); }
  .lede { font-size: 26px; line-height: 1.45; color: var(--text-muted); margin: 0 0 30px; max-width: 92%; }
  .body-text { font-size: 24px; line-height: 1.55; color: var(--text); margin: 0 0 20px; }
  .body-text.muted { color: var(--text-muted); }

  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    margin: 0 0 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    line-height: 1.55;
    overflow: hidden;
    color: var(--text);
  }
  pre.sm { font-size: 17px; padding: 22px 26px; line-height: 1.6; }
  pre.xs { font-size: 15px; padding: 18px 22px; line-height: 1.6; }
  .kw { color: var(--conflict); }
  .fn { color: var(--head); }
  .str { color: var(--branch); }
  .num { color: var(--merge); }
  .com { color: var(--text-dim); font-style: italic; }
  .var { color: var(--merge); }
  .prop { color: var(--accent); }
  .sha { color: var(--staged); }
  .hi { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 10px; margin-left: -13px; display: block; }
  .hi-red { background: rgba(255,107,107,0.12); border-left: 3px solid var(--conflict); padding-left: 10px; margin-left: -13px; display: block; }
  .hi-lime { background: rgba(200,245,115,0.1); border-left: 3px solid var(--branch); padding-left: 10px; margin-left: -13px; display: block; }

  .cover-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-content h1 { font-size: 110px; line-height: 1; letter-spacing: -0.03em; }
  .cover-content .accent-text { color: var(--accent); }
  .cover-content .lime-text { color: var(--branch); }
  .cover-content .gold-text { color: var(--merge); }
  .cover-tagline { font-size: 30px; color: var(--text-muted); margin-top: 32px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .pill.branch { border-color: var(--branch); color: var(--branch); }
  .pill.merge { border-color: var(--merge); color: var(--merge); }
  .pill.staged { border-color: var(--staged); color: var(--staged); }
  .pill.conflict { border-color: var(--conflict); color: var(--conflict); }
  .arrow { color: var(--text-dim); font-size: 26px; font-family: 'JetBrains Mono', monospace; }
  .center-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 16px 0 24px; flex-wrap: wrap; }

  .recap-list { list-style: none; padding: 0; margin: 0; }
  .recap-list li {
    font-size: 24px; line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    padding-left: 36px;
    position: relative;
  }
  .recap-list li::before {
    content: "→"; position: absolute; left: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .recap-list .key { color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .recap-list .lime { color: var(--branch); font-family: 'JetBrains Mono', monospace; }
  .recap-list .gold { color: var(--merge); font-family: 'JetBrains Mono', monospace; }
  .recap-list .red { color: var(--conflict); font-family: 'JetBrains Mono', monospace; }

  .cta {
    margin-top: auto;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 12px;
    text-align: center;
  }
  .cta-text { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .cta-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    color: var(--accent);
    font-weight: 600;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .controls { display: none; }
    .slide { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>

<style>
  html, body { margin: 0 !important; padding: 0 !important; background: #0a0e14 !important; }
  body { display: block !important; gap: 0 !important; }
  .slide { border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div class="slide" id="s3">
  <div class="editor-bar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tab">setImmediate.js</div>
    <div class="slide-num">03 / 08</div>
  </div>
  <div class="content">
    <div class="label"><span class="prompt">$ #</span> two queues, one rule</div>
    <h2>Macrotask queue<br>vs <span style="color:var(--branch);">Microtask queue</span></h2>

    <svg width="100%" viewBox="0 0 920 420" style="margin: 0 0 14px;">
      <defs>
        <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#68a063" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="alime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="#c8f573" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- Macrotask box -->
      <rect x="20" y="20" width="400" height="200" rx="10" fill="#122019" stroke="#2f4a37" stroke-width="1.5"/>
      <text x="220" y="50" text-anchor="middle" fill="#9bb3a0" font-family="Inter, sans-serif" font-size="16" font-weight="600">MACROTASK QUEUE</text>
      <rect x="44" y="66" width="110" height="36" rx="6" fill="#1a2e1e" stroke="#2f4a37" stroke-width="1.2"/>
      <text x="99" y="89" text-anchor="middle" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="13">setTimeout</text>
      <rect x="164" y="66" width="110" height="36" rx="6" fill="#1a2e1e" stroke="#2f4a37" stroke-width="1.2"/>
      <text x="219" y="89" text-anchor="middle" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="13">setInterval</text>
      <rect x="284" y="66" width="110" height="36" rx="6" fill="#1a2e1e" stroke="#2f4a37" stroke-width="1.2"/>
      <text x="339" y="89" text-anchor="middle" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="13">setImmediate</text>

      <rect x="44" y="120" width="100" height="36" rx="6" fill="#1a2e1e" stroke="#2f4a37" stroke-width="1.2"/>
      <text x="94" y="143" text-anchor="middle" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="13">I/O callbacks</text>
      <text x="220" y="185" text-anchor="middle" fill="#6c8275" font-family="Inter, sans-serif" font-size="14" font-style="italic">timers / check / poll phases</text>

      <!-- Microtask box -->
      <rect x="500" y="20" width="400" height="200" rx="10" fill="#0e1f12" stroke="#c8f573" stroke-width="1.5"/>
      <text x="700" y="50" text-anchor="middle" fill="#c8f573" font-family="Inter, sans-serif" font-size="16" font-weight="600">MICROTASK QUEUE</text>
      <rect x="524" y="66" width="140" height="36" rx="6" fill="#142018" stroke="#c8f573" stroke-width="1.2"/>
      <text x="594" y="89" text-anchor="middle" fill="#c8f573" font-family="JetBrains Mono, monospace" font-size="13">Promise.then</text>
      <rect x="674" y="66" width="140" height="36" rx="6" fill="#142018" stroke="#c8f573" stroke-width="1.2"/>
      <text x="744" y="89" text-anchor="middle" fill="#c8f573" font-family="JetBrains Mono, monospace" font-size="13">queueMicrotask</text>
      <rect x="524" y="120" width="130" height="36" rx="6" fill="#142018" stroke="#c8f573" stroke-width="1.2"/>
      <text x="589" y="143" text-anchor="middle" fill="#c8f573" font-family="JetBrains Mono, monospace" font-size="13">MutationObserver</text>
      <text x="700" y="185" text-anchor="middle" fill="#6c8275" font-family="Inter, sans-serif" font-size="14" font-style="italic">runs between macrotasks</text>

      <!-- Rule label -->
      <text x="460" y="265" text-anchor="middle" fill="#9bb3a0" font-family="Inter, sans-serif" font-size="17" font-weight="600">THE RULE</text>
      <rect x="80" y="280" width="760" height="60" rx="10" fill="#0e1f12" stroke="#c8f573" stroke-width="1.5"/>
      <text x="460" y="317" text-anchor="middle" fill="#c8f573" font-family="Inter, sans-serif" font-size="18" font-weight="600">After EACH macrotask → drain ALL microtasks before next macrotask</text>

      <!-- Arrow from rule to queues -->
      <line x1="460" y1="280" x2="350" y2="230" stroke="#c8f573" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#alime)"/>
      <line x1="460" y1="280" x2="600" y2="230" stroke="#c8f573" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#alime)"/>
    </svg>

    <p class="body-text muted" style="font-size: 22px;">Microtasks: <span style="color:var(--branch); font-family:'JetBrains Mono',monospace;">higher priority</span>. Always run before next macro.</p>
  </div>
  <div class="footer">
    <span class="handle">@sensei_vara</span>
    <span class="swipe">swipe →</span>
  </div>
</div>
</body>
</html>
